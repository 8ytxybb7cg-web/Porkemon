<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抽肥豬卡 - Porkémon</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --purple-glow: 0 0 20px #a020f0, 0 0 40px #c020f0, 0 0 80px #e020f0;
            --gold-glow: 0 0 20px #ffd700, 0 0 40px #ffaa00, 0 0 80px #ff8800;
            --white-glow: 0 0 20px #ffffff, 0 0 40px #cccccc, 0 0 80px #aaaaaa;
        }

        /* God Pack 流動彩虹光暈特效 */
        @keyframes rainbow-glow-anim {
            0% { box-shadow: 0 0 20px #ff0000, 0 0 40px #ff7f00, 0 0 80px #ffff00; }
            20% { box-shadow: 0 0 20px #ffff00, 0 0 40px #00ff00, 0 0 80px #0000ff; }
            40% { box-shadow: 0 0 20px #00ff00, 0 0 40px #0000ff, 0 0 80px #4b0082; }
            60% { box-shadow: 0 0 20px #0000ff, 0 0 40px #4b0082, 0 0 80px #9400d3; }
            80% { box-shadow: 0 0 20px #4b0082, 0 0 40px #9400d3, 0 0 80px #ff0000; }
            100% { box-shadow: 0 0 20px #ff0000, 0 0 40px #ff7f00, 0 0 80px #ffff00; }
        }
        .rainbow-glow-anim {
            animation: rainbow-glow-anim 1.5s linear infinite !important;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; 
            height: 100%; height: 100dvh; 
            background-color: #000; color: white;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; touch-action: none;
            overscroll-behavior: none; 
            -webkit-touch-callout: none; 
        }

        /* 背景與 UI 層次 */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
        #ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }

        .screen { 
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            width: 100%; height: 100%; min-height: 0;
        }
        .hidden { display: none !important; }

        /* 身份選擇 */
        .select-wrapper { position: relative; margin-bottom: 50px; pointer-events: auto; display: inline-block; }
        #user-select {
            appearance: none; -webkit-appearance: none; background: transparent; border: none; color: white;
            font-size: 48px; font-weight: bold; 
            padding: 0 40px; cursor: pointer; outline: none;
            text-align: center; text-align-last: center; 
        }
        .custom-arrow { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 24px; color: #888; pointer-events: none; }
        
        #btn-enter { background: transparent; border: 1.5px solid #fff; color: #fff; padding: 10px 40px; font-size: 18px; cursor: pointer; pointer-events: auto; transition: opacity 0.3s; }
        #btn-enter:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 抽卡舞台 */
        #stage { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }

        /* 3D 卡包與結構設計 */
        .pack-wrapper {
            position: absolute; bottom: -100%; 
            height: 70vh; max-height: 500px; aspect-ratio: 75 / 120; 
            transition: bottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
            pointer-events: none;
        }
        .pack-wrapper.active { bottom: 15%; pointer-events: auto; }

        .pack-3d-scene {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* 銀色內層 (袋身背面) */
        .pack-inner-silver {
            position: absolute; top: 15%; left: 0; width: 100%; height: 85%;
            background: linear-gradient(135deg, #f0f0f0 0%, #a0a0a0 40%, #dcdcdc 60%, #888888 100%);
            border-radius: 0 0 10px 10px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            transform-origin: top center;
            z-index: 1;
        }

        /* 底部袋身 85% */
        .pack-bottom {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            clip-path: inset(15% 0 0 0);
            transform-origin: bottom center;
            z-index: 4;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
        }

        /* 頂部封條 15% */
        .pack-top {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            clip-path: inset(0 0 85% 0);
            transform-origin: bottom center;
            z-index: 5;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3));
        }

        /* 光芒系統 (Additive Blending) */
        .pack-glow {
            position: absolute; top: 15%; left: 50%; 
            width: 150%; aspect-ratio: 1; border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            filter: blur(35px); 
            mix-blend-mode: screen;
            opacity: 0; z-index: 2;
            pointer-events: none;
        }
        
        .glow-blue { background: radial-gradient(circle, #ffffff 10%, #60a5fa 50%, transparent 80%); }
        .glow-purple { background: radial-gradient(circle, #ffffff 10%, #c084fc 50%, transparent 80%); mix-blend-mode: color-dodge; }
        .glow-gold { background: radial-gradient(circle, #ffffff 10%, #fbbf24 50%, transparent 80%); mix-blend-mode: color-dodge; animation: breathe-glow 2s infinite alternate; }
        .glow-god { 
            background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000); 
            animation: rainbow-spin 2s linear infinite;
            filter: blur(25px) brightness(1.5);
            mix-blend-mode: color-dodge;
        }

        @keyframes breathe-glow {
            from { transform: translate(-50%, -50%) scale(0.9); }
            to { transform: translate(-50%, -50%) scale(1.1); }
        }
        @keyframes rainbow-spin {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            100% { transform: translate(-50%, -50%) scale(1.2) rotate(360deg); }
        }

        /* 互動偵測區域 */
        #interact-zone {
            position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            z-index: 200; pointer-events: auto;
        }

        /* 3D 翻轉卡片容器 */
        .card-container {
            position: absolute; width: 50vh; max-width: 280px; aspect-ratio: 63/88; 
            perspective: 1000px; display: none; z-index: 100; opacity: 0;
            transition: opacity 1s ease-out, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(100px) scale(0.8); pointer-events: auto; cursor: pointer;
        }
        .card-container.reveal { opacity: 1; transform: translateY(0) scale(1); }
        
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            background-size: cover; background-position: center;
        }
        .card-back { transform: rotateY(0deg); border: 2px solid #333; }
        .card-front { transform: rotateY(180deg); }
        .is-flipped { transform: rotateY(180deg); }

        /* 底部導航 & 共用 Pill 形按鈕 */
        .bottom-nav { position: absolute; bottom: 40px; display: flex; gap: 20px; pointer-events: auto; z-index: 250; }
        .draw-btn { background: #fff; color: #000; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; }
        
        .pill-btn {
            background: transparent; color: #fff; border: 2px solid #fff; border-radius: 50px;
            padding: 10px 30px; font-size: 18px; font-weight: bold; cursor: pointer; pointer-events: auto;
        }

        /* 收藏頁面 */
        #collection-screen { justify-content: flex-start; padding-top: 30px; overflow: hidden; box-sizing: border-box; }
        .collection-header { padding: 10px 20px; text-align: center; width: 100%; flex-shrink: 0; pointer-events: auto; }
        .collection-controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        
        #collection-content { flex: 1; width: 100%; max-width: 600px; overflow-y: auto; pointer-events: auto; padding-bottom: 50px; -webkit-overflow-scrolling: touch; }
        
        .collection-group-title { text-align: center; font-size: 22px; font-weight: bold; margin: 20px 0 15px; color: #fff; }
        .collection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 20px; }
        
        .card-slot { width: 100%; aspect-ratio: 63/88; background: #222; border-radius: 5px; overflow: hidden; }
        .card-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* 全螢幕放大預覽 */
        #fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        #fullscreen-overlay.active { opacity: 1; pointer-events: auto; }
        
        #fullscreen-card-img {
            height: 65vh; max-height: 800px; aspect-ratio: 63/88;
            border-radius: 15px; object-fit: cover;
            -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; pointer-events: auto;
        }

        .long-press-hint { color: #fff; margin-top: 15px; font-size: 18px; font-weight: bold; text-align: center; letter-spacing: 1px; }
        #save-hint { color: #fff; margin-top: 5px; font-size: 16px; font-weight: bold; opacity: 0; transition: opacity 0.3s ease; height: 20px; }
        .overlay-controls { margin-top: 15px; display: flex; gap: 20px; pointer-events: auto; }
        #illustrator-credit { color: #888; font-size: 12px; margin-top: 10px; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="particle-canvas"></canvas> 

<div id="ui-layer">
    <section id="login-screen" class="screen">
        <div class="select-wrapper">
            <select id="user-select">
                <option value="Suki">Suki</option>
                <option value="Nelson">Nelson</option>
                <option value="爸爸">爸爸</option>
                <option value="媽媽">媽媽</option>
                <option value="細佬">細佬</option>
                <option value="Rainbow">Rainbow</option>
            </select>
            <div class="custom-arrow">▼</div>
        </div>
        <button id="btn-enter">進入卡池</button>
    </section>

    <section id="main-screen" class="screen hidden">
        <div id="stage">
            <div id="interact-zone" class="hidden"></div>
        </div>
        <div class="bottom-nav">
            <button class="draw-btn" onclick="prepareDraw(1)">單抽</button>
            <button class="draw-btn" onclick="prepareDraw(10)">十連抽</button>
            <button class="draw-btn" style="background:none; color:white; border:1px solid white;" onclick="showScreen('collection-screen')">收藏</button>
        </div>
    </section>

    <section id="collection-screen" class="screen hidden">
        <div class="collection-header">
            <div class="collection-controls">
                <button class="pill-btn" onclick="showScreen('main-screen')">返回</button>
                <button class="pill-btn" onclick="resetCollection()">重置</button>
            </div>
            <h2 id="user-title" style="margin: 10px 0 0 0;"></h2>
        </div>
        <div id="collection-content"></div>
    </section>
</div>

<div id="fullscreen-overlay" class="hidden">
    <img id="fullscreen-card-img" src="" alt="放大卡片">
    <div class="long-press-hint">長按圖片可進行儲存</div>
    <div id="save-hint"></div>
    <div id="illustrator-credit">Illustrator: Nelson Graphics</div>
    <div class="overlay-controls">
        <button class="pill-btn" onclick="downloadImage()">儲存</button>
        <button class="pill-btn" onclick="closeFullscreen()">返回</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. 全域變數與基礎設定
    // ==========================================
    
    const BASE_URL = "https://raw.githubusercontent.com/8ytxybb7cg-web/Porkemon/main/";
    const IMG_PACK = BASE_URL + "packs/pack.png";
    const IMG_BACK = BASE_URL + "back/back.png";

    const TOTAL_COMMON = 27;
    const TOTAL_RARE = 16;
    const TOTAL_SUPER_RARE = 7;

    let currentUser = "";
    let currentCollectionData = { common: [], rare: [], super_rare: [] }; 
    let drawnCards = [];
    let gameState = "login";
    let isCurrentDrawGodPack = false;
    let currentBurstColor = '#ffffff';

    // 物理拖拽變數
    let isDragging = false;
    let dragStartX = 0;
    let dragCurrentX = 0;
    let dragVelocity = 0;
    let lastDragX = 0;
    let isPackOpened = false;

    // ==========================================
    // 2. 獨立且優先執行的 Canvas 渲染邏輯
    // ==========================================
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    
    let flyingBacks = [];
    let baseParticles = [];
    let blastParticles = [];

    const backImgObj = new Image();
    backImgObj.src = IMG_BACK;

    function resizeCanvas() {
        bgCanvas.width = pCanvas.width = window.innerWidth;
        bgCanvas.height = pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for(let i=0; i<60; i++) {
        baseParticles.push({ x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height, s: Math.random()*2, v: 0.5+Math.random()*1 });
    }
    for(let i=0; i<12; i++) {
        flyingBacks.push({
            x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height,
            r: Math.random()*Math.PI*2, s: 0.3 + Math.random()*0.4,
            vx: (Math.random()-0.5)*1.5, vy: (Math.random()-0.5)*1.5, vr: (Math.random()-0.5)*0.03
        });
    }

    function renderLoop() {
        try {
            bgCtx.fillStyle = '#000';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            const grad = bgCtx.createRadialGradient(bgCanvas.width/2, bgCanvas.height/3, 50, bgCanvas.width/2, bgCanvas.height/3, bgCanvas.width*0.8);
            grad.addColorStop(0, '#1a1a1a'); grad.addColorStop(1, '#000');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0,0, bgCanvas.width, bgCanvas.height);

            bgCtx.fillStyle = 'rgba(255,255,255,0.4)';
            baseParticles.forEach(p => {
                p.y -= p.v;
                if(p.y < 0) p.y = bgCanvas.height;
                bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); bgCtx.fill();
            });

            if(gameState === 'drawing') {
                flyingBacks.forEach(c => {
                    c.x += c.vx; c.y += c.vy; c.r += c.vr;
                    if(c.x < -100) c.x = bgCanvas.width+100; if(c.x > bgCanvas.width+100) c.x = -100;
                    if(c.y < -100) c.y = bgCanvas.height+100; if(c.y > bgCanvas.height+100) c.y = -100;
                    
                    bgCtx.save();
                    bgCtx.translate(c.x, c.y); bgCtx.rotate(c.r); bgCtx.globalAlpha = 0.2;
                    if(backImgObj.complete) bgCtx.drawImage(backImgObj, -50*c.s, -70*c.s, 100*c.s, 140*c.s);
                    bgCtx.restore();
                });
            }

            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

            for(let i=blastParticles.length-1; i>=0; i--) {
                let p = blastParticles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if(p.life <= 0) { blastParticles.splice(i, 1); continue; }
                pCtx.fillStyle = p.color;
                pCtx.globalAlpha = p.life;
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); pCtx.fill();
            }
            pCtx.globalAlpha = 1;
        } catch (error) { }

        requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // ==========================================
    // 3. Supabase 安全連線初始化
    // ==========================================
    const SUPABASE_URL = 'https://myrhatzdypiwwgmmfbuw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15cmhhdHpkeXBpd3dnbW1mYnV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1MTM4NzUsImV4cCI6MjA4MTA4OTg3NX0.s6w2f3pKovuFYkR09bLvPBVJUa6b3Uw2gIXrlw9teb8'; 

    let supabaseClient = null;
    try {
        if (typeof window.supabase !== 'undefined') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            console.error("未能載入 Supabase 核心套件");
        }
    } catch(err) {
        console.error("Supabase 初始化失敗:", err);
    }

    // ==========================================
    // 4. UI 切換與遊戲邏輯
    // ==========================================
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');

        if(id === 'collection-screen') {
            isCurrentDrawGodPack = false;
            document.body.style.touchAction = 'pan-y'; 
            updateCollectionUI();
        } else {
            document.body.style.touchAction = 'none';
        }
    }

    document.getElementById('btn-enter').onclick = async () => {
        currentUser = document.getElementById('user-select').value;
        document.getElementById('user-title').innerText = currentUser + " 的收藏";
        const btn = document.getElementById('btn-enter');
        btn.innerText = "連線資料庫中...";
        btn.disabled = true;

        try {
            if (!supabaseClient) throw new Error("資料庫模組未能啟動。");
            const { data, error } = await supabaseClient.from('user_collections').select('collection').eq('username', currentUser).maybeSingle();
            if (error) throw error;
            if (data) {
                currentCollectionData = data.collection || { common: [], rare: [], super_rare: [] };
                if(!currentCollectionData.super_rare) currentCollectionData.super_rare = [];
                if(!currentCollectionData.rare) currentCollectionData.rare = [];
                if(!currentCollectionData.common) currentCollectionData.common = [];
            } else {
                currentCollectionData = { common: [], rare: [], super_rare: [] };
                const { error: insertError } = await supabaseClient.from('user_collections').insert({ username: currentUser, collection: currentCollectionData });
                if (insertError) throw insertError;
            }
        } catch (err) {
            alert("雲端同步異常，將啟用「單機離線模式」。");
            currentCollectionData = { common: [], rare: [], super_rare: [] };
        } finally {
            gameState = 'drawing';
            showScreen('main-screen');
            btn.innerText = "進入卡池";
            btn.disabled = false;
        }
    };

    async function saveUserCollection() {
        if (!supabaseClient) return;
        try {
            await supabaseClient.from('user_collections').upsert({ 
                username: currentUser, collection: currentCollectionData, updated_at: new Date().toISOString() 
            });
        } catch (err) {}
    }

    function prepareDraw(num) {
        const stage = document.getElementById('stage');
        Array.from(stage.children).forEach(child => {
            if(child.id !== 'interact-zone') child.remove();
        });
        
        drawnCards = [];
        isCurrentDrawGodPack = false;
        isPackOpened = false;
        dragCurrentX = 0; dragVelocity = 0;
        
        const zone = document.getElementById('interact-zone');
        zone.classList.add('hidden');

        // 判定機率
        if (num === 10 && Math.random() < 0.005) {
            isCurrentDrawGodPack = true;
            let srPool = Array.from({length: TOTAL_SUPER_RARE}, (_, i) => (i + 1).toString().padStart(3, '0')).sort(() => Math.random() - 0.5);
            let selectedCards = [];
            if (TOTAL_SUPER_RARE >= 10) {
                selectedCards = srPool.slice(0, 10).map(id => ({ type: 'super_rare', id: id, isGodPack: true }));
            } else {
                selectedCards = srPool.map(id => ({ type: 'super_rare', id: id, isGodPack: true }));
                let rPool = Array.from({length: TOTAL_RARE}, (_, i) => (i + 1).toString().padStart(3, '0')).sort(() => Math.random() - 0.5);
                let needed = 10 - selectedCards.length;
                let rareSelected = rPool.slice(0, needed).map(id => ({ type: 'rare', id: id, isGodPack: true }));
                selectedCards = selectedCards.concat(rareSelected);
            }
            selectedCards.sort(() => Math.random() - 0.5);
            drawnCards = selectedCards;
        }

        for(let i=0; i<num; i++) {
            if (!isCurrentDrawGodPack) {
                const rand = Math.random();
                let cardType, maxId;
                if (rand < 0.01) { cardType = 'super_rare'; maxId = TOTAL_SUPER_RARE; } 
                else if (rand < 0.04) { cardType = 'rare'; maxId = TOTAL_RARE; } 
                else { cardType = 'common'; maxId = TOTAL_COMMON; }
                const cardId = Math.floor(Math.random() * maxId + 1).toString().padStart(3, '0');
                drawnCards.push({type: cardType, id: cardId, isGodPack: false});
            }
        }

        // 決定整包的光芒顏色 (依最高稀有度)
        let maxRarityLevel = 0;
        if(isCurrentDrawGodPack) maxRarityLevel = 4;
        else if(drawnCards.some(c => c.type === 'super_rare')) maxRarityLevel = 3;
        else if(drawnCards.some(c => c.type === 'rare')) maxRarityLevel = 2;
        else maxRarityLevel = 1;

        let glowClass = '';
        if(maxRarityLevel === 4) { glowClass = 'glow-god'; currentBurstColor = 'rainbow'; }
        else if(maxRarityLevel === 3) { glowClass = 'glow-gold'; currentBurstColor = '#fbbf24'; }
        else if(maxRarityLevel === 2) { glowClass = 'glow-purple'; currentBurstColor = '#c084fc'; }
        else { glowClass = 'glow-blue'; currentBurstColor = '#60a5fa'; }

        // 建立 3D 卡包
        for(let i=0; i<num; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'pack-wrapper';
            wrap.id = `pack-${i}`;
            wrap.style.zIndex = 50 - i;
            
            let offsetX = num > 1 ? (Math.random()-0.5)*15 : 0;
            let offsetY = num > 1 ? (Math.random()-0.5)*15 : 0;
            wrap.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${(Math.random()-0.5)*3}deg)`;
            
            wrap.innerHTML = `
                <div class="pack-3d-scene">
                    <div class="pack-inner-silver"></div>
                    <div class="pack-glow ${glowClass}"></div>
                    <div class="pack-bottom" style="background-image:url(${IMG_PACK})"></div>
                    <div class="pack-top" style="background-image:url(${IMG_PACK})"></div>
                </div>
            `;
            stage.appendChild(wrap);
        }

        setTimeout(() => {
            document.querySelectorAll('.pack-wrapper').forEach(p => p.classList.add('active'));
            zone.classList.remove('hidden');
        }, 50);
    }

    // ==========================================
    // 5. Framer-Motion-like 物理拖拽開包邏輯
    // ==========================================
    const interactZone = document.getElementById('interact-zone');
    
    interactZone.addEventListener('touchstart', (e) => {
        if(isPackOpened) return;
        isDragging = true;
        dragStartX = e.touches[0].clientX;
        lastDragX = dragStartX;
        dragVelocity = 0;
    });

    interactZone.addEventListener('touchmove', (e) => {
        if(!isDragging || isPackOpened) return;
        const currentX = e.touches[0].clientX;
        dragCurrentX = currentX - dragStartX;
        dragVelocity = currentX - lastDragX;
        lastDragX = currentX;

        updatePackTransforms();
    });

    interactZone.addEventListener('touchend', () => {
        if(!isDragging || isPackOpened) return;
        isDragging = false;

        // 臨界點判斷：拖拽超過螢幕寬度 30% 或瞬間速度大於 12
        if (Math.abs(dragCurrentX) > window.innerWidth * 0.3 || Math.abs(dragVelocity) > 12) {
            triggerSnapOpen(dragCurrentX > 0 ? 1 : -1);
        } else {
            // 彈性回彈 (Spring physics)
            requestAnimationFrame(springBack);
        }
    });

    function updatePackTransforms() {
        const tops = document.querySelectorAll('.pack-top');
        const glows = document.querySelectorAll('.pack-glow');
        const bottoms = document.querySelectorAll('.pack-bottom');
        
        tops.forEach(t => {
            // 位移並帶有輕微旋轉與上抬
            t.style.transform = `translateX(${dragCurrentX}px) translateY(-${Math.abs(dragCurrentX)*0.1}px) rotate(${dragCurrentX*0.05}deg)`;
        });

        glows.forEach(g => {
            // 滲光效果
            g.style.opacity = Math.min(Math.abs(dragCurrentX) / 150, 0.7);
            g.style.transform = `translate(-50%, -50%) scale(${0.1 + Math.abs(dragCurrentX)/300})`;
        });
        
        bottoms.forEach(b => {
             // 拖拽時底部微微受力變形
             b.style.transform = `rotateX(${Math.abs(dragCurrentX)*0.02}deg)`;
        });
    }

    function springBack() {
        if (isDragging || isPackOpened) return;
        dragCurrentX *= 0.8; // 彈性阻尼係數
        
        if (Math.abs(dragCurrentX) < 1) {
            dragCurrentX = 0;
            updatePackTransforms();
            return;
        }
        updatePackTransforms();
        requestAnimationFrame(springBack);
    }

    function triggerSnapOpen(direction) {
        isPackOpened = true;
        document.getElementById('interact-zone').classList.add('hidden');

        const tops = document.querySelectorAll('.pack-top');
        const bottoms = document.querySelectorAll('.pack-bottom');
        const inners = document.querySelectorAll('.pack-inner-silver');
        const glows = document.querySelectorAll('.pack-glow');

        // 1. 撕裂飛走
        tops.forEach(t => {
            t.style.transition = 'transform 0.5s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.5s';
            t.style.transform = `translateX(${direction * window.innerWidth * 1.5}px) translateY(-200px) rotate(${direction * 90}deg)`;
            t.style.opacity = '0';
        });

        // 2. 3D 袋口撐開
        bottoms.forEach(b => {
            b.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            b.style.transform = 'perspective(800px) rotateX(25deg) translateY(5%)';
        });

        inners.forEach(i => {
            i.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            i.style.transform = 'perspective(800px) rotateX(-20deg) translateY(-5%) scaleY(1.05)';
        });

        // 3. 扇形光芒噴發
        setTimeout(() => {
            glows.forEach(g => {
                g.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                g.style.opacity = '1';
                g.style.transform = 'translate(-50%, -50%) scale(3.5)';
            });
            triggerBlast(currentBurstColor);
        }, 150);

        // 4. 隱藏卡包，升起卡牌
        setTimeout(() => {
            document.querySelectorAll('.pack-wrapper').forEach(p => p.style.opacity = '0');
            drawnCards.forEach((_, idx) => showResultCard(idx));
        }, 800);
    }

    function triggerBlast(color) {
        const rainbowColors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];
        for(let i=0; i<100; i++) {
            let pColor = color === 'rainbow' ? rainbowColors[Math.floor(Math.random() * rainbowColors.length)] : color;
            blastParticles.push({
                x: window.innerWidth/2, y: window.innerHeight * 0.4,
                vx: (Math.random()-0.5) * 18, vy: (Math.random()-0.5) * 18 - 5, // 偏上扇形噴發
                s: Math.random() * 6 + 2, life: 1.2, color: pColor
            });
        }
    }

    function showResultCard(idx) {
        const result = drawnCards[idx];
        const stage = document.getElementById('stage');
        const container = document.createElement('div');
        container.className = 'card-container';
        
        if(drawnCards.length > 1) {
            container.style.width = '25vw';
            container.style.maxWidth = '150px';
            const row = Math.floor(idx / 5); const col = idx % 5;
            container.style.left = `${10 + col * 16}%`;
            container.style.top = `${20 + row * 30}%`;
        }

        let cardBackClass = "card-back";
        let cardBackStyle = `background-image:url('${IMG_BACK}');`;

        if (result.isGodPack) {
            cardBackClass += " rainbow-glow-anim";
        } else {
            let glow = 'var(--white-glow)';
            if (result.type === 'super_rare') glow = 'var(--purple-glow)';
            else if (result.type === 'rare') glow = 'var(--gold-glow)';
            cardBackStyle += ` box-shadow:${glow};`;
        }
        
        const frontImgSrc = `${BASE_URL}cards_${result.type}/${result.id}.PNG`;
        
        container.innerHTML = `
            <div class="card-inner" onclick="flipCard(this, '${result.type}', '${result.id}')">
                <div class="${cardBackClass}" style="${cardBackStyle}"></div>
                <div class="card-front" style="background-image:url('${frontImgSrc}')"></div>
            </div>
        `;
        
        stage.appendChild(container);
        container.style.display = 'block';
        setTimeout(() => { container.classList.add('reveal'); }, 50 * idx);
    }

    function flipCard(el, type, id) {
        if(el.classList.contains('is-flipped')) {
            openFullscreen(type, id);
            return;
        }
        el.classList.add('is-flipped');
        if(!currentCollectionData[type].includes(id)) {
            currentCollectionData[type].push(id);
            saveUserCollection();
        }
    }

    function openFullscreen(type, id) {
        const imgSrc = `${BASE_URL}cards_${type}/${id}.PNG`;
        const overlay = document.getElementById('fullscreen-overlay');
        const img = document.getElementById('fullscreen-card-img');
        
        img.src = imgSrc;
        if (isCurrentDrawGodPack) {
            img.className = 'rainbow-glow-anim';
            img.style.boxShadow = 'none';
        } else {
            img.className = '';
            if (type === 'super_rare') img.style.boxShadow = 'var(--purple-glow)';
            else if (type === 'rare') img.style.boxShadow = 'var(--gold-glow)';
            else img.style.boxShadow = 'var(--white-glow)';
        }
        
        overlay.classList.remove('hidden');
        void overlay.offsetWidth; 
        overlay.classList.add('active');
    }

    function closeFullscreen() {
        const overlay = document.getElementById('fullscreen-overlay');
        overlay.classList.remove('active');
        setTimeout(() => {
            overlay.classList.add('hidden');
            document.getElementById('save-hint').style.opacity = '0'; 
        }, 300);
    }

    async function downloadImage() {
        const img = document.getElementById('fullscreen-card-img');
        const imgSrc = img.src;
        const hint = document.getElementById('save-hint');
        try {
            hint.innerText = "下載中...";
            hint.style.opacity = '1';
            const response = await fetch(imgSrc);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            const filename = imgSrc.split('/').pop() || 'porkemon_card.png';
            a.download = 'Porkemon_' + filename;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
            hint.innerText = "下載完成！";
            setTimeout(() => hint.style.opacity = '0', 2000);
        } catch (error) {
            hint.innerText = "下載失敗，請長按圖片儲存";
            setTimeout(() => hint.style.opacity = '0', 3000);
        }
    }

    async function resetCollection() {
        if(confirm(`確定要重置 ${currentUser} 的收藏嗎？此操作無法還原並會同步至資料庫。`)) {
            currentCollectionData = { common: [], rare: [], super_rare: [] };
            updateCollectionUI(); 
            await saveUserCollection();
        }
    }

    function updateCollectionUI() {
        const content = document.getElementById('collection-content');
        let data = currentCollectionData || { common: [], rare: [], super_rare: [] };
        content.innerHTML = "";

        const srTitle = document.createElement('div');
        srTitle.className = 'collection-group-title';
        srTitle.innerText = `超級稀有卡 (${data.super_rare.length}/${TOTAL_SUPER_RARE})`;
        content.appendChild(srTitle);
        
        const srGrid = document.createElement('div');
        srGrid.className = 'collection-grid';
        for(let i=1; i<=TOTAL_SUPER_RARE; i++) {
            const id = i.toString().padStart(3, '0');
            const isOwned = data.super_rare.includes(id);
            const slot = document.createElement('div');
            slot.className = 'card-slot';
            const imgSrc = isOwned ? `${BASE_URL}cards_super_rare/${id}.PNG` : IMG_BACK;
            slot.innerHTML = `<img src="${imgSrc}" alt="Super Rare ${id}">`;
            if(isOwned) { slot.onclick = () => openFullscreen('super_rare', id); slot.style.cursor = 'pointer'; }
            srGrid.appendChild(slot);
        }
        content.appendChild(srGrid);

        const rareTitle = document.createElement('div');
        rareTitle.className = 'collection-group-title';
        rareTitle.innerText = `稀有卡 (${data.rare.length}/${TOTAL_RARE})`;
        content.appendChild(rareTitle);
        
        const rareGrid = document.createElement('div');
        rareGrid.className = 'collection-grid';
        for(let i=1; i<=TOTAL_RARE; i++) {
            const id = i.toString().padStart(3, '0');
            const isOwned = data.rare.includes(id);
            const slot = document.createElement('div');
            slot.className = 'card-slot';
            const imgSrc = isOwned ? `${BASE_URL}cards_rare/${id}.PNG` : IMG_BACK;
            slot.innerHTML = `<img src="${imgSrc}" alt="Rare ${id}">`;
            if(isOwned) { slot.onclick = () => openFullscreen('rare', id); slot.style.cursor = 'pointer'; }
            rareGrid.appendChild(slot);
        }
        content.appendChild(rareGrid);

        const commonTitle = document.createElement('div');
        commonTitle.className = 'collection-group-title';
        commonTitle.innerText = `普通卡 (${data.common.length}/${TOTAL_COMMON})`;
        content.appendChild(commonTitle);
        
        const commonGrid = document.createElement('div');
        commonGrid.className = 'collection-grid';
        for(let i=1; i<=TOTAL_COMMON; i++) {
            const id = i.toString().padStart(3, '0');
            const isOwned = data.common.includes(id);
            const slot = document.createElement('div');
            slot.className = 'card-slot';
            const imgSrc = isOwned ? `${BASE_URL}cards_common/${id}.PNG` : IMG_BACK;
            slot.innerHTML = `<img src="${imgSrc}" alt="Common ${id}">`;
            if(isOwned) { slot.onclick = () => openFullscreen('common', id); slot.style.cursor = 'pointer'; }
            commonGrid.appendChild(slot);
        }
        content.appendChild(commonGrid);
    }
</script>
