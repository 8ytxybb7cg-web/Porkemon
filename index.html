<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抽肥豬卡 - Porkémon (Supabase 版)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --purple-glow: 0 0 20px #a020f0, 0 0 40px #c020f0, 0 0 80px #e020f0;
            --gold-glow: 0 0 20px #ffd700, 0 0 40px #ffaa00, 0 0 80px #ff8800;
            --white-glow: 0 0 20px #ffffff, 0 0 40px #cccccc, 0 0 80px #aaaaaa;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; 
            height: 100%; height: 100dvh;
            background-color: #000; color: white;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; 
            touch-action: none;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
        }

        canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }

        .screen {
            position: absolute; width: 100%; height: 100%;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 10; background: transparent;
        }

        .screen.active { display: flex; }

        /* 登入頁面樣式 */
        #login-screen h1 {
            font-size: 2.5rem; margin-bottom: 20px;
            text-shadow: var(--purple-glow);
        }
        select, .btn-primary {
            padding: 12px 30px; font-size: 1.2rem;
            border-radius: 25px; border: none; margin: 10px;
            cursor: pointer; transition: 0.3s;
        }
        select { background: rgba(255,255,255,0.1); color: white; border: 1px solid #a020f0; }
        .btn-primary {
            background: linear-gradient(45deg, #a020f0, #ff00ff);
            color: white; font-weight: bold; box-shadow: 0 0 15px #a020f0;
        }
        .btn-primary:active { transform: scale(0.95); }

        /* 主頁面樣式 */
        .stats-bar {
            position: absolute; top: 20px; width: 90%;
            display: flex; justify-content: space-around;
            background: rgba(0,0,0,0.6); padding: 10px;
            border-radius: 15px; border: 1px solid #444;
        }
        .draw-container {
            display: flex; gap: 20px; margin-top: 50px;
        }
        .draw-btn {
            width: 120px; height: 120px; border-radius: 50%;
            border: none; cursor: pointer; font-weight: bold;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.3s; color: white;
        }
        .single-draw { background: linear-gradient(135deg, #444, #888); box-shadow: var(--white-glow); }
        .ten-draw { background: linear-gradient(135deg, #d4af37, #f9d71c); color: #000; box-shadow: var(--gold-glow); }

        /* 收藏館樣式 */
        #collection-content {
            width: 90%; height: 70%; overflow-y: auto;
            margin-top: 20px; padding: 10px;
        }
        .collection-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            margin-bottom: 30px;
        }
        .card-slot {
            aspect-ratio: 2/3; background: rgba(255,255,255,0.05);
            border-radius: 5px; border: 1px solid #333; overflow: hidden;
        }
        .card-slot img { width: 100%; height: 100%; object-fit: cover; opacity: 0.3; filter: grayscale(1); }
        .card-slot img.owned { opacity: 1; filter: none; }
        .collection-group-title {
            padding: 10px; font-weight: bold; border-left: 4px solid #a020f0;
            margin: 15px 0; background: rgba(160,32,240,0.1);
        }

        /* 抽卡動畫全屏 */
        #reveal-screen { background: rgba(0,0,0,0.95); z-index: 100; }
        .reveal-card {
            width: 250px; aspect-ratio: 2/3;
            perspective: 1000px; position: relative;
        }
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 15px;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        .card-back { background: #222 url('https://porkemon-cards.netlify.app/card_back.PNG') center/cover; }
        .card-front { transform: rotateY(180deg); background-size: cover; }
        
        /* 稀有度光效 */
        .glow-sr { box-shadow: var(--purple-glow) !important; }
        .glow-rare { box-shadow: var(--gold-glow) !important; }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="login-screen" class="screen active">
    <h1>Porkémon</h1>
    <select id="user-select">
        <option value="Player1">Player1 (大肥豬)</option>
        <option value="Player2">Player2 (二肥豬)</option>
        <option value="Player3">Player3 (小肥豬)</option>
    </select>
    <button class="btn-primary" id="btn-enter">進入卡池</button>
</div>

<div id="main-screen" class="screen">
    <div class="stats-bar">
        <div id="stat-rare">稀有: 0/15</div>
        <div id="stat-sr">超稀有: 0/5</div>
        <div id="stat-common">普通: 0/20</div>
    </div>
    
    <div class="draw-container">
        <button class="draw-btn single-draw" onclick="handleDraw(1)">
            <span>單抽</span>
            <small>消耗 1</small>
        </button>
        <button class="draw-btn ten-draw" onclick="handleDraw(10)">
            <span>十連抽</span>
            <small>必中 SR?</small>
        </button>
    </div>

    <div style="margin-top: 40px; display: flex; gap: 10px;">
        <button class="btn-primary" onclick="showScreen('collection-screen'); updateCollectionUI();">查看收藏</button>
    </div>
</div>

<div id="collection-screen" class="screen">
    <h2 style="margin-top: 60px;">我的收藏</h2>
    <div id="collection-content"></div>
    <button class="btn-primary" onclick="showScreen('main-screen')" style="margin: 20px;">返回</button>
</div>

<div id="reveal-screen" class="screen">
    <div id="reveal-container"></div>
    <button id="btn-reveal-close" class="btn-primary" style="display:none; margin-top: 20px;">收下卡片</button>
</div>

<script>
    // --- Supabase 配置 (請填寫你的資訊) ---
    const SUPABASE_URL = 'https://myrhatzdypiwwgmmfbuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_bnnah-2fsCaQnKZDoKNJQw_NuYQVvKi';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- 遊戲常量 ---
    const TOTAL_COMMON = 20;
    const TOTAL_RARE = 15;
    const TOTAL_SR = 5;
    const BASE_URL = 'https://porkemon-cards.netlify.app/';
    const IMG_BACK = BASE_URL + 'card_back.PNG';

    // --- 全域狀態 ---
    let currentUser = "";
    let currentCollection = { common: [], rare: [], sr: [] };

    // --- 初始化 Canvas 背景 ---
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, stars = [], floatingCards = [];

    function initCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        stars = Array.from({length: 100}, () => ({
            x: Math.random() * width, y: Math.random() * height,
            size: Math.random() * 2, speed: Math.random() * 0.5 + 0.2
        }));
        floatingCards = Array.from({length: 6}, () => ({
            x: Math.random() * width, y: Math.random() * height,
            w: 60, h: 90, angle: Math.random() * Math.PI * 2,
            rotSpeed: (Math.random() - 0.5) * 0.02,
            speedY: Math.random() * 0.5 + 0.2
        }));
    }

    function renderLoop() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, width, height);
        
        // 畫星星
        ctx.fillStyle = '#fff';
        stars.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
            s.y += s.speed;
            if(s.y > height) s.y = -10;
        });

        // 畫漂浮卡背
        floatingCards.forEach(c => {
            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.rotate(c.angle);
            ctx.globalAlpha = 0.2;
            ctx.fillStyle = '#333';
            ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
            ctx.strokeStyle = '#666';
            ctx.strokeRect(-c.w/2, -c.h/2, c.w, c.h);
            ctx.restore();
            c.y += c.speedY;
            c.angle += c.rotSpeed;
            if(c.y > height + 50) c.y = -100;
        });
        requestAnimationFrame(renderLoop);
    }

    window.addEventListener('resize', initCanvas);
    initCanvas();
    renderLoop();

    // --- 畫面切換 ---
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // --- 登入邏輯 (Supabase) ---
    document.getElementById('btn-enter').onclick = async () => {
        currentUser = document.getElementById('user-select').value;
        const btn = document.getElementById('btn-enter');
        btn.innerText = "讀取中...";
        btn.disabled = true;

        try {
            // 嘗試讀取資料
            let { data, error } = await supabase
                .from('user_collections')
                .select('*')
                .eq('user_id', currentUser)
                .single();

            if (error && error.code === 'PGRST116') {
                // 如果找不到資料 (NotFound)，則建立新用戶資料
                const initialData = { user_id: currentUser, common: [], rare: [], sr: [] };
                const { error: insertError } = await supabase
                    .from('user_collections')
                    .insert([initialData]);
                
                if (insertError) throw insertError;
                currentCollection = initialData;
            } else if (error) {
                throw error;
            } else {
                // 成功讀取
                currentCollection = {
                    common: data.common || [],
                    rare: data.rare || [],
                    sr: data.sr || []
                };
            }

            updateStats();
            showScreen('main-screen');
        } catch (err) {
            console.error("Supabase Error:", err);
            alert("無法連線到資料庫，請檢查網絡或 Supabase 設定。");
        } finally {
            btn.innerText = "進入卡池";
            btn.disabled = false;
        }
    };

    function updateStats() {
        document.getElementById('stat-common').innerText = `普通: ${currentCollection.common.length}/${TOTAL_COMMON}`;
        document.getElementById('stat-rare').innerText = `稀有: ${currentCollection.rare.length}/${TOTAL_RARE}`;
        document.getElementById('stat-sr').innerText = `超稀有: ${currentCollection.sr.length}/${TOTAL_SR}`;
    }

    // --- 抽卡邏輯 ---
    async function handleDraw(count) {
        const results = [];
        for(let i=0; i<count; i++) {
            results.push(getRandomCard());
        }
        
        // 更新本地資料
        results.forEach(card => {
            if(!currentCollection[card.type].includes(card.id)) {
                currentCollection[card.type].push(card.id);
            }
        });

        // 顯示揭曉動畫
        showRevealAnimation(results);

        // 同步到 Supabase
        await saveToSupabase();
        updateStats();
    }

    function getRandomCard() {
        const rand = Math.random() * 100;
        if(rand < 5) { // 5% SR
            return { type: 'sr', id: Math.floor(Math.random()*TOTAL_SR + 1).toString().padStart(3,'0') };
        } else if(rand < 25) { // 20% Rare
            return { type: 'rare', id: Math.floor(Math.random()*TOTAL_RARE + 1).toString().padStart(3,'0') };
        } else { // 75% Common
            return { type: 'common', id: Math.floor(Math.random()*TOTAL_COMMON + 1).toString().padStart(3,'0') };
        }
    }

    async function saveToSupabase() {
        try {
            await supabase
                .from('user_collections')
                .update({
                    common: currentCollection.common,
                    rare: currentCollection.rare,
                    sr: currentCollection.sr
                })
                .eq('user_id', currentUser);
        } catch (err) {
            console.error("Update failed:", err);
        }
    }

    // --- 揭曉動畫 ---
    function showRevealAnimation(cards) {
        const container = document.getElementById('reveal-container');
        const closeBtn = document.getElementById('btn-reveal-close');
        container.innerHTML = "";
        closeBtn.style.display = "none";
        showScreen('reveal-screen');

        cards.forEach((card, index) => {
            setTimeout(() => {
                const cardEl = document.createElement('div');
                cardEl.className = 'reveal-card';
                const rarityGlow = card.type === 'sr' ? 'glow-sr' : (card.type === 'rare' ? 'glow-rare' : '');
                
                cardEl.innerHTML = `
                    <div class="card-inner" id="card-inner-${index}">
                        <div class="card-back"></div>
                        <div class="card-front ${rarityGlow}" style="background-image: url('${BASE_URL}cards_${card.type}/${card.id}.PNG')"></div>
                    </div>
                `;
                container.appendChild(cardEl);

                // 點擊翻牌
                cardEl.onclick = () => {
                    cardEl.querySelector('.card-inner').classList.add('flipped');
                    checkAllFlipped();
                };
            }, index * 200);
        });

        function checkAllFlipped() {
            const flipped = document.querySelectorAll('.card-inner.flipped').length;
            if(flipped === cards.length) {
                closeBtn.style.display = "block";
            }
        }
        
        closeBtn.onclick = () => showScreen('main-screen');
    }

    // --- 收藏館 UI ---
    function updateCollectionUI() {
        const content = document.getElementById('collection-content');
        content.innerHTML = "";

        const sections = [
            { title: '超稀有 SR', type: 'sr', total: TOTAL_SR },
            { title: '稀有 Rare', type: 'rare', total: TOTAL_RARE },
            { title: '普通 Common', type: 'common', total: TOTAL_COMMON }
        ];

        sections.forEach(sec => {
            const title = document.createElement('div');
            title.className = 'collection-group-title';
            title.innerText = `${sec.title} (${currentCollection[sec.type].length}/${sec.total})`;
            content.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'collection-grid';
            
            for(let i=1; i<=sec.total; i++) {
                const id = i.toString().padStart(3, '0');
                const isOwned = currentCollection[sec.type].includes(id);
                const slot = document.createElement('div');
                slot.className = 'card-slot';
                
                const img = document.createElement('img');
                img.src = isOwned ? `${BASE_URL}cards_${sec.type}/${id}.PNG` : IMG_BACK;
                if(isOwned) img.classList.add('owned');
                
                slot.appendChild(img);
                grid.appendChild(slot);
            }
            content.appendChild(grid);
        });
    }
</script>

</body>
</html>
