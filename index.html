<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抽肥豬卡 - Porkémon</title>
    <style>
        :root {
            --gold-glow: 0 0 20px #ffd700, 0 0 40px #ffaa00;
            --white-glow: 0 0 20px #ffffff, 0 0 40px #cccccc;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: white;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; touch-action: none;
        }

        /* 背景 Canvas: 負責 Spotlight 與 飛舞卡背 */
        #bg-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
        }

        #ui-layer {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; pointer-events: none;
        }

        .screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hidden { display: none !important; }

        /* 身份選擇 */
        .select-wrapper { position: relative; margin-bottom: 50px; pointer-events: auto; }
        #user-select {
            appearance: none; -webkit-appearance: none;
            background: transparent; border: none; color: white;
            font-size: 48px; font-weight: bold; padding-right: 40px;
            cursor: pointer; outline: none; text-align: center;
        }
        .custom-arrow {
            position: absolute; right: 0; top: 60%; transform: translateY(-50%);
            font-size: 24px; color: #888; pointer-events: none;
        }
        #btn-enter {
            background: transparent; border: 1.5px solid #fff; color: #fff;
            padding: 10px 40px; font-size: 18px; cursor: pointer; pointer-events: auto;
        }

        /* 抽卡舞台 */
        #stage {
            position: relative; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
        }

        .pack-wrapper {
            position: absolute; bottom: -100%; width: 70vw; max-width: 400px;
            transition: bottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
        }
        .pack-img { width: 100%; display: block; }
        .pack-wrapper.active { bottom: 15%; }

        /* 切開動畫 */
        .pack-half {
            position: absolute; top: 0; width: 100%; height: 100%;
            background-size: 100% 100%; transition: transform 0.6s ease-in;
        }
        .split-left { clip-path: inset(0 50% 0 0); }
        .split-right { clip-path: inset(0 0 0 50%); }

        /* 偵測區域 */
        #slash-zone {
            position: absolute; top: 15%; width: 80%; height: 25%;
            z-index: 200; pointer-events: auto;
        }

        /* 卡片容器 */
        .card-container {
            position: absolute; width: 60vw; max-width: 300px; aspect-ratio: 2/3;
            perspective: 1000px; display: none; z-index: 150;
        }
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.8s; transform-style: preserve-3d;
        }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 10px;
        }
        .card-back { transform: rotateY(0deg); }
        .card-front { transform: rotateY(180deg); }
        .is-flipped { transform: rotateY(180deg); }

        /* 特效粒子 */
        .glow-overlay {
            position: absolute; width: 100%; height: 100%;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }

        /* 控制按鈕 */
        .bottom-nav {
            position: absolute; bottom: 40px; display: flex; gap: 20px; pointer-events: auto;
        }
        .draw-btn {
            background: #fff; color: #000; border: none; padding: 12px 30px;
            font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer;
        }

        /* 收藏頁面 */
        #collection-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            padding: 20px; width: 90%; overflow-y: auto; pointer-events: auto;
        }
        .card-slot { width: 100%; aspect-ratio: 2/3; background: #222; border-radius: 5px; overflow: hidden; }
        .card-slot img { width: 100%; opacity: 0.2; }
        .card-slot.owned img { opacity: 1; box-shadow: var(--white-glow); }
        .card-slot.rare.owned img { box-shadow: var(--gold-glow); }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="ui-layer">
    <section id="login-screen" class="screen">
        <div class="select-wrapper">
            <select id="user-select">
                <option value="Suki">Suki</option>
                <option value="Nelson">Nelson</option>
                <option value="爸爸">爸爸</option>
                <option value="媽媽">媽媽</option>
                <option value="細佬">細佬</option>
                <option value="Rainbow">Rainbow</option>
            </select>
            <div class="custom-arrow">▼</div>
        </div>
        <button id="btn-enter">進入卡池</button>
    </section>

    <section id="main-screen" class="screen hidden">
        <div id="stage">
            <div id="slash-zone" class="hidden"></div>
            </div>
        <div class="bottom-nav">
            <button class="draw-btn" onclick="prepareDraw(1)">單抽</button>
            <button class="draw-btn" onclick="prepareDraw(10)">十連抽</button>
            <button class="draw-btn" style="background:none; color:white; border:1px solid white;" onclick="showScreen('collection-screen')">收藏</button>
        </div>
    </section>

    <section id="collection-screen" class="screen hidden">
        <div style="padding: 20px; pointer-events: auto;">
            <button class="draw-btn" onclick="showScreen('main-screen')">返回</button>
            <h2 id="user-title"></h2>
        </div>
        <div id="collection-grid"></div>
    </section>
</div>

<script>
    const BASE_URL = "https://8ytxybb7cg-web.github.io/Porkemon/";
    const IMG_PACK = BASE_URL + "packs/IMG_8749.jpeg";
    const IMG_BACK = BASE_URL + "back/super_resolution_20260414230213306.jpeg";
    
    let currentUser = "";
    let drawnCards = [];
    let isSlashing = false;

    // --- 背景 Canvas 動畫 (Spotlight + 飛舞卡背) ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let cards = [];
    const backImg = new Image();
    backImg.src = IMG_BACK;

    function initBackground() {
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        window.dispatchEvent(new Event('resize'));

        for(let i=0; i<15; i++) {
            cards.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * Math.PI * 2,
                s: 0.5 + Math.random() * 0.5,
                vx: (Math.random() - 0.5) * 1,
                vy: (Math.random() - 0.5) * 1,
                vr: (Math.random() - 0.5) * 0.02
            });
        }
        render();
    }

    function render() {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Spotlight
        const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/3, 50, canvas.width/2, canvas.height/3, canvas.width*0.8);
        grad.addColorStop(0, '#1a1a1a');
        grad.addColorStop(1, '#000');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0, canvas.width, canvas.height);

        // 飛舞卡背
        cards.forEach(c => {
            c.x += c.vx; c.y += c.vy; c.r += c.vr;
            if(c.x < -100) c.x = canvas.width + 100;
            if(c.x > canvas.width + 100) c.x = -100;
            if(c.y < -100) c.y = canvas.height + 100;
            if(c.y > canvas.height + 100) c.y = -100;

            ctx.save();
            ctx.translate(c.x, c.y);
            ctx.rotate(c.r);
            ctx.globalAlpha = 0.4;
            if(backImg.complete) ctx.drawImage(backImg, -40*c.s, -60*c.s, 80*c.s, 120*c.s);
            ctx.restore();
        });

        // 畫切開的光芒軌跡 (如果是 Slashing)
        if(isSlashing && slashPath.length > 1) {
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#fff";
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(slashPath[0].x, slashPath[0].y);
            slashPath.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        requestAnimationFrame(render);
    }

    // --- 抽卡邏輯 ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'collection-screen') updateCollectionUI();
    }

    document.getElementById('btn-enter').onclick = () => {
        currentUser = document.getElementById('user-select').value;
        document.getElementById('user-title').innerText = currentUser + " 的收藏";
        showScreen('main-screen');
    };

    function prepareDraw(num) {
        const stage = document.getElementById('stage');
        stage.innerHTML = '<div id="slash-zone"></div>';
        drawnCards = [];

        // 生成十連抽或單抽的卡包 (重疊效果)
        for(let i=0; i<num; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'pack-wrapper';
            wrap.id = `pack-${i}`;
            wrap.style.zIndex = 50 - i;
            wrap.style.transform = `rotate(${(Math.random()-0.5)*5}deg) translate(${i*2}px, ${i*2}px)`;
            wrap.innerHTML = `<img src="${IMG_PACK}" class="pack-img">`;
            stage.appendChild(wrap);
            
            // 預抽卡片結果
            const isRare = Math.random() < 0.03;
            const cardId = isRare ? 
                Math.floor(Math.random() * 9 + 1).toString().padStart(3, '0') : 
                Math.floor(Math.random() * 14 + 1).toString().padStart(3, '0');
            drawnCards.push({type: isRare ? 'rare' : 'common', id: cardId});
        }

        setTimeout(() => {
            document.querySelectorAll('.pack-wrapper').forEach(p => p.classList.add('active'));
            document.getElementById('slash-zone').classList.remove('hidden');
        }, 100);
    }

    // --- 水果忍者切開動作 ---
    let slashPath = [];
    const zone = document.getElementById('ui-layer'); // 監聽全螢幕
    zone.addEventListener('touchstart', (e) => {
        if(document.getElementById('slash-zone').classList.contains('hidden')) return;
        isSlashing = true;
        slashPath = [{x: e.touches[0].clientX, y: e.touches[0].clientY}];
    });

    zone.addEventListener('touchmove', (e) => {
        if(!isSlashing) return;
        const x = e.touches[0].clientX;
        const y = e.touches[0].clientY;
        slashPath.push({x, y});
        
        // 檢查是否劃過 slash-zone
        const zoneRect = document.getElementById('slash-zone').getBoundingClientRect();
        if(x > zoneRect.left && x < zoneRect.right && y > zoneRect.top && y < zoneRect.bottom) {
            executeCut();
            isSlashing = false;
        }
    });

    zone.addEventListener('touchend', () => { 
        isSlashing = false; 
        slashPath = [];
    });

    function executeCut() {
        document.getElementById('slash-zone').classList.add('hidden');
        const packs = document.querySelectorAll('.pack-wrapper');
        
        packs.forEach((p, idx) => {
            // 切開效果
            const rect = p.getBoundingClientRect();
            p.innerHTML = `
                <div class="pack-half split-left" style="background-image:url(${IMG_PACK})"></div>
                <div class="pack-half split-right" style="background-image:url(${IMG_PACK})"></div>
            `;
            setTimeout(() => {
                p.querySelector('.split-left').style.transform = 'translateX(-100px) rotate(-20deg)';
                p.querySelector('.split-right').style.transform = 'translateX(100px) rotate(20deg)';
                p.style.opacity = '0';
            }, 50);

            // 顯示卡片
            setTimeout(() => {
                showResultCard(idx);
            }, 600);
        });
    }

    function showResultCard(idx) {
        const result = drawnCards[idx];
        const stage = document.getElementById('stage');
        const container = document.createElement('div');
        container.className = 'card-container';
        container.style.display = 'block';
        // 十連抽排列
        if(drawnCards.length > 1) {
            const row = Math.floor(idx / 5);
            const col = idx % 5;
            container.style.width = '18vw';
            container.style.left = `${col * 20 + 2}%`;
            container.style.top = `${row * 35 + 10}%`;
        }

        const glowColor = result.type === 'rare' ? 'var(--gold-glow)' : 'var(--white-glow)';
        
        container.innerHTML = `
            <div class="card-inner" onclick="flipCard(this, '${result.type}', '${result.id}')">
                <div class="card-back"><img src="${IMG_BACK}" style="width:100%; height:100%; border-radius:10px; box-shadow:${glowColor}"></div>
                <div class="card-front"><img src="${BASE_URL}cards_${result.type}/${result.id}.png" style="width:100%; height:100%; border-radius:10px;"></div>
            </div>
        `;
        stage.appendChild(container);
    }

    function flipCard(el, type, id) {
        if(el.classList.contains('is-flipped')) return;
        el.classList.add('is-flipped');
        
        // 儲存到本地
        let data = JSON.parse(localStorage.getItem('porkemon_' + currentUser) || '{"common":[], "rare":[]}');
        if(!data[type].includes(id)) data[type].push(id);
        localStorage.setItem('porkemon_' + currentUser, JSON.stringify(data));
    }

    function updateCollectionUI() {
        const grid = document.getElementById('collection-grid');
        let data = JSON.parse(localStorage.getItem('porkemon_' + currentUser) || '{"common":[], "rare":[]}');
        grid.innerHTML = "";
        
        // 顯示 Common
        for(let i=1; i<=14; i++) {
            const id = i.toString().padStart(3, '0');
            const slot = document.createElement('div');
            slot.className = `card-slot ${data.common.includes(id) ? 'owned' : ''}`;
            slot.innerHTML = `<img src="${BASE_URL}cards_common/${id}.png">`;
            grid.appendChild(slot);
        }
        // 顯示 Rare
        for(let i=1; i<=9; i++) {
            const id = i.toString().padStart(3, '0');
            const slot = document.createElement('div');
            slot.className = `card-slot rare ${data.rare.includes(id) ? 'owned' : ''}`;
            slot.innerHTML = `<img src="${BASE_URL}cards_rare/${id}.png">`;
            grid.appendChild(slot);
        }
    }

    initBackground();
</script>
</body>
</html>
