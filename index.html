<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抽肥豬卡 - Porkémon</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* 更新光環顏色定義 */
            --blue-glow: 0 0 20px #0055ff, 0 0 40px #00aaff, 0 0 80px #88ddff;    /* 普通 */
            --purple-glow: 0 0 20px #a020f0, 0 0 40px #c020f0, 0 0 80px #e020f0;  /* 稀有 */
            --gold-glow: 0 0 20px #ffd700, 0 0 40px #ffaa00, 0 0 80px #ff8800;    /* 超級稀有 */
            --platinum-glow: 0 0 20px #ffffff, 0 0 40px #e5e4e2, 0 0 80px #fffafa, 0 0 100px #ffffff; /* God Pack 白金 */
        }

        body, html {
            margin: 0; padding: 0; width: 100%; 
            height: 100%; height: 100dvh; 
            background-color: #000; color: white;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; touch-action: none;
            overscroll-behavior: none; 
            -webkit-touch-callout: none; 
        }

        /* 背景與 UI 層次 */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
        #ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }

        .screen { 
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            width: 100%; height: 100%; min-height: 0; position: relative;
        }
        .hidden { display: none !important; }

        /* God Pack 專屬彩虹背景特效 */
        #god-pack-bg {
            position: absolute;
            top: 50%; left: 50%;
            width: 250vw; height: 250vh;
            transform: translate(-50%, -50%);
            background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            animation: spin-rainbow 4s linear infinite;
            opacity: 0.6;
            z-index: -2; /* 置於 main-screen 內層最底部 */
            pointer-events: none;
        }
        #god-pack-glow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 65%);
            z-index: -1;
            pointer-events: none;
            animation: pulse-glow 2s ease-in-out infinite alternate;
        }
        @keyframes spin-rainbow {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes pulse-glow {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        /* 身份選擇 */
        .select-wrapper { position: relative; margin-bottom: 50px; pointer-events: auto; display: inline-block; }
        #user-select {
            appearance: none; -webkit-appearance: none; background: transparent; border: none; color: white;
            font-size: 48px; font-weight: bold; 
            padding: 0 40px; cursor: pointer; outline: none; text-align: center; text-align-last: center; 
        }
        .custom-arrow { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 24px; color: #888; pointer-events: none; }
        
        #btn-enter { background: transparent; border: 1.5px solid #fff; color: #fff; padding: 10px 40px; font-size: 18px; cursor: pointer; pointer-events: auto; transition: opacity 0.3s; }
        #btn-enter:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 抽卡舞台 */
        #stage { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: auto; }

        /* 切開動畫與包裝容器 */
        .pack-wrapper {
            position: absolute; bottom: -100%; 
            height: 70vh; aspect-ratio: 75 / 120; 
            transition: bottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .pack-wrapper.active { bottom: 15%; pointer-events: auto; }
        
        .pack-half {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            transition: transform 0.8s ease-in, opacity 0.8s ease-in;
        }
        .split-left { clip-path: polygon(0 0, 100% 0, 0 100%); }
        .split-right { clip-path: polygon(100% 0, 100% 100%, 0 100%); }

        /* 偵測區域 */
        #slash-zone { position: absolute; top: 0; left: 15%; width: 70%; height: 35%; z-index: 200; pointer-events: auto; }

        /* 3D 翻轉卡片容器 */
        .card-container {
            position: absolute;
            width: 50vh; max-width: 280px; aspect-ratio: 63/88; 
            perspective: 1000px; display: none; z-index: 100; opacity: 0;
            transition: opacity 1s ease-out, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translate(-50%, calc(-50% + 100px)) scale(0.5); /* 初始位置與縮放 */
            transform-origin: center center;
            pointer-events: auto; cursor: pointer;
        }
        .card-container.reveal { 
            opacity: 1; 
            transform: translate(var(--tx, -50%), var(--ty, -50%)) scale(var(--tscale, 1));
        }
        
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            background-size: cover; background-position: center;
        }
        .card-back { transform: rotateY(0deg); border: 2px solid #333; }
        .card-front { transform: rotateY(180deg); }
        .is-flipped { transform: rotateY(180deg); }

        /* 底部導航 & 共用 Pill 形按鈕 */
        .bottom-nav { position: absolute; bottom: 40px; display: flex; gap: 20px; pointer-events: auto; z-index: 250; }
        .draw-btn { background: #fff; color: #000; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; }
        
        .pill-btn {
            background: transparent; color: #fff; border: 2px solid #fff; border-radius: 50px;
            padding: 10px 30px; font-size: 18px; font-weight: bold; cursor: pointer; pointer-events: auto;
        }

        /* 收藏頁面 */
        #collection-screen { justify-content: flex-start; padding-top: 30px; overflow: hidden; box-sizing: border-box; }
        .collection-header { padding: 10px 20px; text-align: center; width: 100%; flex-shrink: 0; pointer-events: auto; }
        .collection-controls { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        
        #collection-content { flex: 1; width: 100%; max-width: 600px; overflow-y: auto; pointer-events: auto; padding-bottom: 50px; -webkit-overflow-scrolling: touch; }
        
        .collection-group-title { text-align: center; font-size: 22px; font-weight: bold; margin: 20px 0 15px; color: #fff; }
        .collection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 20px; }
        
        .card-slot { width: 100%; aspect-ratio: 63/88; background: #222; border-radius: 5px; overflow: hidden; }
        .card-slot img { width: 100%; height: 100%; object-fit: cover; }

        /* 全螢幕放大預覽 */
        #fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        #fullscreen-overlay.active { opacity: 1; pointer-events: auto; }
        
        #fullscreen-card-img {
            height: 65vh; max-height: 800px; aspect-ratio: 63/88;
            border-radius: 15px; object-fit: cover;
            -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; pointer-events: auto;
        }

        .long-press-hint { color: #fff; margin-top: 15px; font-size: 18px; font-weight: bold; text-align: center; letter-spacing: 1px; }
        #save-hint { color: #fff; margin-top: 5px; font-size: 16px; font-weight: bold; opacity: 0; transition: opacity 0.3s ease; height: 20px; }
        .overlay-controls { margin-top: 15px; display: flex; gap: 20px; pointer-events: auto; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="particle-canvas"></canvas> 

<div id="ui-layer">
    <section id="login-screen" class="screen">
        <div class="select-wrapper">
            <select id="user-select">
                <option value="Suki">Suki</option>
                <option value="Nelson">Nelson</option>
                <option value="爸爸">爸爸</option>
                <option value="媽媽">媽媽</option>
                <option value="細佬">細佬</option>
                <option value="Rainbow">Rainbow</option>
            </select>
            <div class="custom-arrow">▼</div>
        </div>
        <button id="btn-enter">進入卡池</button>
    </section>

    <section id="main-screen" class="screen hidden">
        <div id="god-pack-bg" class="hidden"></div>
        <div id="god-pack-glow" class="hidden"></div>
        
        <div id="stage" onclick="flipAllRemaining()">
            <div id="slash-zone" class="hidden"></div>
        </div>
        
        <div class="bottom-nav hidden" id="action-buttons">
            <button class="draw-btn" onclick="prepareDraw(1)">單抽</button>
            <button class="draw-btn" onclick="prepareDraw(10)">十連抽</button>
            <button class="draw-btn" style="background:none; color:white; border:1px solid white;" onclick="showScreen('collection-screen')">收藏</button>
        </div>
    </section>

    <section id="collection-screen" class="screen hidden">
        <div class="collection-header">
            <div class="collection-controls">
                <button class="pill-btn" onclick="showScreen('main-screen')">返回</button>
                <button class="pill-btn" onclick="resetCollection()">重置</button>
            </div>
            <h2 id="user-title" style="margin: 10px 0 0 0;"></h2>
        </div>
        <div id="collection-content"></div>
    </section>
</div>

<div id="fullscreen-overlay" class="hidden">
    <img id="fullscreen-card-img" src="" alt="放大卡片">
    <div class="long-press-hint">長按圖片可進行儲存</div>
    <div id="save-hint"></div>
    <div class="overlay-controls">
        <button class="pill-btn" onclick="downloadImage()">儲存</button>
        <button class="pill-btn" onclick="closeFullscreen()">返回</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. 全域變數與基礎設定
    // ==========================================
    
    const BASE_URL = "https://raw.githubusercontent.com/8ytxybb7cg-web/Porkemon/main/";
    const IMG_PACK = BASE_URL + "packs/pack.png";
    const IMG_BACK = BASE_URL + "back/back.png";
    const TOTAL_COMMON = 28;
    const TOTAL_RARE = 16;
    const TOTAL_SUPER_RARE = 7;

    let currentUser = "";
    let currentCollectionData = { common: [], rare: [], super_rare: [] }; 
    let drawnCards = [];
    let flippedCount = 0; // 用於追蹤當前翻開的卡牌數量
    let isSlashing = false;
    let gameState = "login";
    let isCurrentDrawGodPack = false;

    // ==========================================
    // 2. 獨立且優先執行的 Canvas 渲染邏輯
    // ==========================================
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    
    let flyingBacks = [];
    let baseParticles = [];
    let blastParticles = [];
    let slashPath = [];

    const backImgObj = new Image();
    backImgObj.src = IMG_BACK;

    function resizeCanvas() {
        bgCanvas.width = pCanvas.width = window.innerWidth;
        bgCanvas.height = pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for(let i=0; i<60; i++) {
        baseParticles.push({ x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height, s: Math.random()*2, v: 0.5+Math.random()*1 });
    }
    for(let i=0; i<12; i++) {
        flyingBacks.push({
            x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height,
            r: Math.random()*Math.PI*2, s: 0.3 + Math.random()*0.4,
            vx: (Math.random()-0.5)*1.5, vy: (Math.random()-0.5)*1.5, vr: (Math.random()-0.5)*0.03
        });
    }

    function renderLoop() {
        try {
            bgCtx.fillStyle = '#000';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            const grad = bgCtx.createRadialGradient(bgCanvas.width/2, bgCanvas.height/3, 50, bgCanvas.width/2, bgCanvas.height/3, bgCanvas.width*0.8);
            grad.addColorStop(0, '#1a1a1a'); grad.addColorStop(1, '#000');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0,0, bgCanvas.width, bgCanvas.height);

            bgCtx.fillStyle = 'rgba(255,255,255,0.4)';
            baseParticles.forEach(p => {
                p.y -= p.v;
                if(p.y < 0) p.y = bgCanvas.height;
                bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); bgCtx.fill();
            });

            if(gameState === 'drawing') {
                flyingBacks.forEach(c => {
                    c.x += c.vx; c.y += c.vy; c.r += c.vr;
                    if(c.x < -100) c.x = bgCanvas.width+100; if(c.x > bgCanvas.width+100) c.x = -100;
                    if(c.y < -100) c.y = bgCanvas.height+100; if(c.y > bgCanvas.height+100) c.y = -100;
                    
                    bgCtx.save();
                    bgCtx.translate(c.x, c.y); bgCtx.rotate(c.r); bgCtx.globalAlpha = 0.2;
                    if(backImgObj.complete) bgCtx.drawImage(backImgObj, -50*c.s, -70*c.s, 100*c.s, 140*c.s);
                    bgCtx.restore();
                });
            }

            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

            if(isSlashing && slashPath.length > 1) {
                pCtx.shadowBlur = 20;
                pCtx.shadowColor = "#fff"; pCtx.strokeStyle = "#fff";
                pCtx.lineWidth = 6; pCtx.lineCap = "round";
                pCtx.beginPath(); pCtx.moveTo(slashPath[0].x, slashPath[0].y);
                slashPath.forEach(p => pCtx.lineTo(p.x, p.y)); pCtx.stroke();
                pCtx.shadowBlur = 0;
            }

            for(let i=blastParticles.length-1; i>=0; i--) {
                let p = blastParticles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if(p.life <= 0) { blastParticles.splice(i, 1); continue; }
                pCtx.fillStyle = p.color;
                pCtx.globalAlpha = p.life;
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); pCtx.fill();
            }
            pCtx.globalAlpha = 1;
        } catch (error) {}

        requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // ==========================================
    // 3. Supabase 安全連線初始化
    // ==========================================
    const SUPABASE_URL = 'https://myrhatzdypiwwgmmfbuw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15cmhhdHpkeXBpd3dnbW1mYnV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1MTM4NzUsImV4cCI6MjA4MTA4OTg3NX0.s6w2f3pKovuFYkR09bLvPBVJUa6b3Uw2gIXrlw9teb8'; 

    let supabaseClient = null;
    try {
        if (typeof window.supabase !== 'undefined') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            console.error("未能載入 Supabase 核心套件");
        }
    } catch(err) {
        console.error("Supabase 初始化失敗:", err);
    }

    // ==========================================
    // 4. UI 切換與遊戲邏輯
    // ==========================================
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');

        if(id === 'collection-screen') {
            isCurrentDrawGodPack = false;
            document.getElementById('god-pack-bg').classList.add('hidden');
            document.getElementById('god-pack-glow').classList.add('hidden');
            document.body.style.touchAction = 'pan-y'; 
            updateCollectionUI();
            document.getElementById('action-buttons').classList.remove('hidden');
        } else if (id === 'main-screen' && drawnCards.length === 0) {
            // 如果剛進入卡池畫面且尚未抽卡，確保顯示選單
            document.getElementById('action-buttons').classList.remove('hidden');
            document.body.style.touchAction = 'none';
        } else {
            document.body.style.touchAction = 'none';
        }
    }

    document.getElementById('btn-enter').onclick = async () => {
        currentUser = document.getElementById('user-select').value;
        document.getElementById('user-title').innerText = currentUser + " 的收藏";
        
        const btn = document.getElementById('btn-enter');
        btn.innerText = "連線資料庫中...";
        btn.disabled = true;

        try {
            if (!supabaseClient) throw new Error("資料庫模組未能啟動。");
            const { data, error } = await supabaseClient
                .from('user_collections')
                .select('collection')
                .eq('username', currentUser)
                .maybeSingle();

            if (error) throw error;

            if (data) {
                currentCollectionData = data.collection || { common: [], rare: [], super_rare: [] };
                if(!currentCollectionData.super_rare) currentCollectionData.super_rare = [];
                if(!currentCollectionData.rare) currentCollectionData.rare = [];
                if(!currentCollectionData.common) currentCollectionData.common = [];
            } else {
                currentCollectionData = { common: [], rare: [], super_rare: [] };
                const { error: insertError } = await supabaseClient
                    .from('user_collections')
                    .insert({ username: currentUser, collection: currentCollectionData });
                if (insertError) throw insertError;
            }
        } catch (err) {
            console.error("Supabase 發生例外狀況:", err);
            alert("雲端同步異常，原因：\n" + (err.message || JSON.stringify(err)) + "\n\n將自動啟用「單機離線模式」。");
            currentCollectionData = { common: [], rare: [], super_rare: [] };
        } finally {
            gameState = 'drawing';
            showScreen('main-screen');
            btn.innerText = "進入卡池";
            btn.disabled = false;
        }
    };

    async function saveUserCollection() {
        if (!supabaseClient) return;
        try {
            await supabaseClient
                .from('user_collections')
                .upsert({ 
                    username: currentUser,
                    collection: currentCollectionData, 
                    updated_at: new Date().toISOString() 
                });
        } catch (err) {
            console.error("背景儲存發生錯誤:", err);
        }
    }

    function prepareDraw(num) {
        // 隱藏選單防止誤觸
        document.getElementById('action-buttons').classList.add('hidden');
        
        const stage = document.getElementById('stage');
        Array.from(stage.children).forEach(child => {
            if(child.id !== 'slash-zone') child.remove();
        });

        drawnCards = [];
        flippedCount = 0;
        isCurrentDrawGodPack = false;
        document.getElementById('god-pack-bg').classList.add('hidden');
        document.getElementById('god-pack-glow').classList.add('hidden');
        
        const zone = document.getElementById('slash-zone');
        zone.classList.add('hidden');

        if (num === 10 && Math.random() < 0.005) {
            isCurrentDrawGodPack = true;
            let srPool = Array.from({length: TOTAL_SUPER_RARE}, (_, i) => (i + 1).toString().padStart(3, '0'));
            srPool.sort(() => Math.random() - 0.5); 

            let selectedCards = [];
            if (TOTAL_SUPER_RARE >= 10) {
                selectedCards = srPool.slice(0, 10).map(id => ({ type: 'super_rare', id: id, isGodPack: true }));
            } else {
                selectedCards = srPool.map(id => ({ type: 'super_rare', id: id, isGodPack: true }));
                let rPool = Array.from({length: TOTAL_RARE}, (_, i) => (i + 1).toString().padStart(3, '0'));
                rPool.sort(() => Math.random() - 0.5); 
                
                let needed = 10 - selectedCards.length;
                let rareSelected = rPool.slice(0, needed).map(id => ({ type: 'rare', id: id, isGodPack: true }));
                selectedCards = selectedCards.concat(rareSelected);
            }
            selectedCards.sort(() => Math.random() - 0.5);
            drawnCards = selectedCards;
        }

        for(let i=0; i<num; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'pack-wrapper';
            wrap.id = `pack-${i}`;
            wrap.style.zIndex = 50 - i;
            
            let offsetX = num > 1 ? (Math.random()-0.5)*20 : 0;
            let offsetY = num > 1 ? (Math.random()-0.5)*20 : 0;
            wrap.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${(Math.random()-0.5)*4}deg)`;
            
            wrap.innerHTML = `
                <div class="pack-half split-left" style="background-image:url(${IMG_PACK})"></div>
                <div class="pack-half split-right" style="background-image:url(${IMG_PACK})"></div>
            `;
            stage.appendChild(wrap);
            
            if (!isCurrentDrawGodPack) {
                const rand = Math.random();
                let cardType, maxId;
                
                if (rand < 0.01) {
                    cardType = 'super_rare'; maxId = TOTAL_SUPER_RARE;
                } else if (rand < 0.04) { 
                    cardType = 'rare'; maxId = TOTAL_RARE;
                } else {
                    cardType = 'common'; maxId = TOTAL_COMMON;
                }
                
                const cardId = Math.floor(Math.random() * maxId + 1).toString().padStart(3, '0');
                drawnCards.push({type: cardType, id: cardId, isGodPack: false});
            }
        }

        setTimeout(() => {
            document.querySelectorAll('.pack-wrapper').forEach(p => p.classList.add('active'));
            zone.classList.remove('hidden');
        }, 50);
    }

    const uiLayer = document.getElementById('ui-layer');
    uiLayer.addEventListener('touchstart', (e) => {
        if(document.getElementById('slash-zone').classList.contains('hidden')) return;
        isSlashing = true; slashPath = [{x: e.touches[0].clientX, y: e.touches[0].clientY}];
    });

    uiLayer.addEventListener('touchmove', (e) => {
        if(!isSlashing) return;
        const x = e.touches[0].clientX; const y = e.touches[0].clientY;
        slashPath.push({x, y});
        
        const zoneRect = document.getElementById('slash-zone').getBoundingClientRect();
        if(x > zoneRect.left && x < zoneRect.right && y > zoneRect.top && y < zoneRect.bottom) {
            executeCut();
            isSlashing = false;
        }
    });

    uiLayer.addEventListener('touchend', () => { isSlashing = false; slashPath = []; });

    function executeCut() {
        document.getElementById('slash-zone').classList.add('hidden');
        const packs = document.querySelectorAll('.pack-wrapper');
        let hasSuperRare = drawnCards.some(c => c.type === 'super_rare');
        let hasRare = drawnCards.some(c => c.type === 'rare');
        
        let blastColor = '#ffffff';
        if (isCurrentDrawGodPack) {
            blastColor = 'rainbow';
            document.getElementById('god-pack-bg').classList.remove('hidden');
            document.getElementById('god-pack-glow').classList.remove('hidden');
        }
        else if (hasSuperRare) blastColor = '#ffd700';
        else if (hasRare) blastColor = '#a020f0';
        
        triggerBlast(blastColor);
        
        packs.forEach((p, idx) => {
            const left = p.querySelector('.split-left');
            const right = p.querySelector('.split-right');
            left.style.transform = 'translate(-30%, 50%) rotate(-30deg)';
            right.style.transform = 'translate(30%, 50%) rotate(30deg)';
            left.style.opacity = '0'; right.style.opacity = '0';
           
            setTimeout(() => { showResultCard(idx); }, 500);
        });
    }

    function triggerBlast(color) {
        const rainbowColors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];
        for(let i=0; i<80; i++) {
            let pColor = color === 'rainbow' ? rainbowColors[Math.floor(Math.random() * rainbowColors.length)] : color;
            
            blastParticles.push({
                x: window.innerWidth/2, y: window.innerHeight * 0.4,
                vx: (Math.random()-0.5) * 15, vy: (Math.random()-0.5) * 15,
                s: Math.random() * 5 + 2, life: 1, color: pColor
            });
        }
    }

    function showResultCard(idx) {
        const result = drawnCards[idx];
        const stage = document.getElementById('stage');
        const container = document.createElement('div');
        container.className = 'card-container';

        let tx = '-50%', ty = '-50%', tscale = '1';

        if(drawnCards.length > 1) { // 3-4-3 排列
            container.style.width = '22vw'; 
            container.style.maxWidth = '90px';
            tscale = '0.85'; 

            let x, y;
            if (idx < 3) {
                y = '25%'; x = `${18 + idx * 32}%`; 
            } else if (idx < 7) {
                y = '50%'; x = `${16 + (idx - 3) * 22.66}%`; 
            } else {
                y = '75%'; x = `${18 + (idx - 7) * 32}%`; 
            }
            container.style.left = x;
            container.style.top = y;
        } else {
            container.style.left = '50%';
            container.style.top = '50%';
            tscale = '1.2';
        }

        container.style.setProperty('--tx', tx);
        container.style.setProperty('--ty', ty);
        container.style.setProperty('--tscale', tscale);

        let cardBackStyle = `background-image:url('${IMG_BACK}');`;
        
        if (result.isGodPack) {
            cardBackStyle += ` box-shadow: var(--platinum-glow);`;
        } else {
            let glow = 'var(--blue-glow)'; // 預設普通
            if (result.type === 'super_rare') glow = 'var(--gold-glow)';
            else if (result.type === 'rare') glow = 'var(--purple-glow)';
            cardBackStyle += ` box-shadow:${glow};`;
        }
        
        const frontImgSrc = `${BASE_URL}cards_${result.type}/${result.id}.PNG`;
        container.innerHTML = `
            <div class="card-inner" onclick="flipCard(event, this, '${result.type}', '${result.id}')">
                <div class="card-back" style="${cardBackStyle}"></div>
                <div class="card-front" style="background-image:url('${frontImgSrc}')"></div>
            </div>
        `;
        stage.appendChild(container);
        
        container.style.display = 'block';
        setTimeout(() => { container.classList.add('reveal'); }, 50 * idx);
    }

    function checkDrawComplete() {
        if (flippedCount === drawnCards.length) {
            setTimeout(() => {
                document.getElementById('action-buttons').classList.remove('hidden');
            }, 500);
        }
    }

    function flipCard(event, el, type, id) {
        if (event) event.stopPropagation(); // 阻止冒泡到 stage 觸發全部翻開

        if(el.classList.contains('is-flipped')) {
            if (flippedCount < drawnCards.length) {
                flipAllRemaining(); // 若還有未翻開的，點擊已翻開卡牌視同翻開全部
            } else {
                openFullscreen(type, id);
            }
            return;
        }
        
        el.classList.add('is-flipped');
        flippedCount++;
        checkDrawComplete();

        if(!currentCollectionData[type].includes(id)) {
            currentCollectionData[type].push(id);
            saveUserCollection();
        }
    }

    function flipAllRemaining() {
        if (drawnCards.length === 0 || flippedCount >= drawnCards.length) return;
        
        const unflipped = document.querySelectorAll('.card-inner:not(.is-flipped)');
        unflipped.forEach((card, index) => {
            setTimeout(() => {
                card.click();
            }, index * 100); 
        });
    }

    function openFullscreen(type, id) {
        const imgSrc = `${BASE_URL}cards_${type}/${id}.PNG`;
        const overlay = document.getElementById('fullscreen-overlay');
        const img = document.getElementById('fullscreen-card-img');
        
        img.src = imgSrc;
        
        if (isCurrentDrawGodPack) {
            img.style.boxShadow = 'var(--platinum-glow)';
        } else {
            if (type === 'super_rare') img.style.boxShadow = 'var(--gold-glow)';
            else if (type === 'rare') img.style.boxShadow = 'var(--purple-glow)';
            else img.style.boxShadow = 'var(--blue-glow)';
        }
        
        overlay.classList.remove('hidden');
        void overlay.offsetWidth; 
        overlay.classList.add('active');
    }

    function closeFullscreen() {
        const overlay = document.getElementById('fullscreen-overlay');
        overlay.classList.remove('active');
        setTimeout(() => {
            overlay.classList.add('hidden');
            document.getElementById('save-hint').style.opacity = '0'; 
        }, 300);
    }

    async function downloadImage() {
        const img = document.getElementById('fullscreen-card-img');
        const imgSrc = img.src;
        const hint = document.getElementById('save-hint');
        
        try {
            hint.innerText = "下載中...";
            hint.style.opacity = '1';

            const response = await fetch(imgSrc);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            
            const filename = imgSrc.split('/').pop() || 'porkemon_card.png';
            a.download = 'Porkemon_' + filename;
            
            document.body.appendChild(a);
            a.click();
            
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);

            hint.innerText = "下載完成！";
            setTimeout(() => hint.style.opacity = '0', 2000);
        } catch (error) {
            console.error('下載圖片失敗:', error);
            hint.innerText = "下載失敗，請長按圖片儲存";
            setTimeout(() => hint.style.opacity = '0', 3000);
        }
    }

    async function resetCollection() {
        if(confirm(`確定要重置 ${currentUser} 的收藏嗎？此操作無法還原並會同步至資料庫。`)) {
            currentCollectionData = { common: [], rare: [], super_rare: [] };
            updateCollectionUI(); 
            await saveUserCollection();
        }
    }

    function updateCollectionUI() {
        const content = document.getElementById('collection-content');
        let data = currentCollectionData || { common: [], rare: [], super_rare: [] };
        content.innerHTML = "";

        const srTitle = document.createElement('div');
        srTitle.className = 'collection-group-title';
        srTitle.innerText = `超級稀有卡 (${data.super_rare.length}/${TOTAL_SUPER_RARE})`;
        content.appendChild(srTitle);
        
        const srGrid = document.createElement('div');
        srGrid.className = 'collection-grid';
        for(let i=1; i<=TOTAL_SUPER_RARE; i++) {
            const id = i.toString().padStart(3, '0');
            const isOwned = data.super_rare.includes(id);
            const slot = document.createElement('div');
            slot.className = 'card-slot';
            const imgSrc = isOwned ? `${BASE_URL}cards_super_rare/${id}.PNG` : IMG_BACK;
            slot.innerHTML = `<img src="${imgSrc}" alt="Super Rare ${id}">`;
            
            if(isOwned) {
                slot.onclick = () => openFullscreen('super_rare', id);
                slot.style.cursor = 'pointer';
            }
            srGrid.appendChild(slot);
        }
        content.appendChild(srGrid);

        const rareTitle = document.createElement('div');
        rareTitle.className = 'collection-group-title';
        rareTitle.innerText = `稀有卡 (${data.rare.length}/${TOTAL_RARE})`;
        content.appendChild(rareTitle);
        
        const rareGrid = document.createElement('div');
        rareGrid.className = 'collection-grid';
        for(let i=1; i<=TOTAL_RARE; i++) {
            const id = i.toString().padStart(3, '0');
            const isOwned = data.rare.includes(id);
            const slot = document.createElement('div');
            slot.className = 'card-slot';
            const imgSrc = isOwned ? `${BASE_URL}cards_rare/${id}.PNG` : IMG_BACK;
            slot.innerHTML = `<img src="${imgSrc}" alt="Rare ${id}">`;
            
            if(isOwned) {
                slot.onclick = () => openFullscreen('rare', id);
                slot.style.cursor = 'pointer';
            }
            rareGrid.appendChild(slot);
        }
        content.appendChild(rareGrid);

        const commonTitle = document.createElement('div');
        commonTitle.className = 'collection-group-title';
        commonTitle.innerText = `普通卡 (${data.common.length}/${TOTAL_COMMON})`;
        content.appendChild(commonTitle);
        
        const commonGrid = document.createElement('div');
        commonGrid.className = 'collection-grid';
        for(let i=1; i<=TOTAL_COMMON; i++) {
            const id = i.toString().padStart(3, '0');
            const isOwned = data.common.includes(id);
            const slot = document.createElement('div');
            slot.className = 'card-slot';
            const imgSrc = isOwned ? `${BASE_URL}cards_common/${id}.PNG` : IMG_BACK;
            slot.innerHTML = `<img src="${imgSrc}" alt="Common ${id}">`;
            
            if(isOwned) {
                slot.onclick = () => openFullscreen('common', id);
                slot.style.cursor = 'pointer';
            }
            commonGrid.appendChild(slot);
        }
        content.appendChild(commonGrid);
    }
</script>
