<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://8ytxybb7cg-web.github.io/Porkemon/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    
    <title>抽肥豬卡 - Porkémon</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* 光環顏色定義 */
            --blue-glow: 0 0 20px #0055ff, 0 0 40px #00aaff, 0 0 80px #88ddff;
            --purple-glow: 0 0 20px #a020f0, 0 0 40px #c020f0, 0 0 80px #e020f0;
            --gold-glow: 0 0 20px #ffd700, 0 0 40px #ffaa00, 0 0 80px #ff8800;
            --red-glow: 0 0 20px #ff0000, 0 0 40px #ff4444, 0 0 80px #ff8888;
            --platinum-glow: 0 0 20px #ffffff, 0 0 40px #e5e4e2, 0 0 80px #fffafa, 0 0 100px #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; 
            background-color: #000; color: white;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; touch-action: none;
            overscroll-behavior: none; -webkit-touch-callout: none; 
        }

        /* 背景與 UI 層次 */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
        #ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }

        .screen { 
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            width: 100%; height: 100%; min-height: 0; position: relative;
        }
        .hidden { display: none !important; }

        /* PWA 安裝按鈕與提示 (玻璃質感) */
        #btn-install { 
            background: linear-gradient(45deg, #444, #222); border: 1.5px solid #fff; color: #fff; 
            padding: 10px 40px; font-size: 16px; cursor: pointer; pointer-events: auto; 
            transition: opacity 0.3s; margin-top: 15px; border-radius: 25px; box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        #ios-install-prompt {
            position: absolute; bottom: calc(30px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 320px; padding: 20px 15px;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px;
            text-align: center; color: white; z-index: 1000; font-size: 15px; line-height: 1.6;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto;
        }
        #ios-install-prompt .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; font-weight: bold; color: rgba(255,255,255,0.6); }

        /* 玩家狀態資訊條 */
        #top-info {
            position: absolute; top: calc(20px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px;
            border: 1px solid #fff; font-size: 18px; font-weight: bold;
            z-index: 200; pointer-events: auto; white-space: nowrap; box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* 金色玩家名稱特效 */
        .golden-name {
            background: linear-gradient(45deg, #ffd700, #ffaa00, #fffafa); -webkit-background-clip: text;
            color: transparent; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); font-weight: 900 !important; letter-spacing: 1px;
        }

        /* God Pack 專屬彩虹背景特效 */
        #god-pack-bg {
            position: absolute; top: 50%; left: 50%; width: 250vw; height: 250vh;
            transform: translate(-50%, -50%); background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            animation: spin-rainbow 4s linear infinite; opacity: 0.6; z-index: -2; pointer-events: none;
        }
        #god-pack-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 65%);
            z-index: -1; pointer-events: none; animation: pulse-glow 2s ease-in-out infinite alternate;
        }
        @keyframes spin-rainbow { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes pulse-glow { from { opacity: 0.5; } to { opacity: 1; } }

        /* 身份選擇 */
        .select-wrapper { position: relative; margin-bottom: 50px; pointer-events: auto; display: inline-block; }
        #username-input {
            background: transparent; border: none; border-bottom: 2px solid #fff;
            color: white; font-size: 32px; font-weight: bold; padding: 10px 20px;
            text-align: center; outline: none; width: 250px;
        }
        #username-input::placeholder { color: rgba(255,255,255,0.4); font-size: 24px; }
        
        #btn-enter { background: transparent; border: 1.5px solid #fff; color: #fff; padding: 10px 40px; font-size: 18px; cursor: pointer; pointer-events: auto; transition: opacity 0.3s; }
        #btn-enter:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 抽卡舞台 */
        #stage { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: auto; }

        /* ==============================
           修改重點：卡包全螢幕最大化與比例鎖定
           ============================== */
        .pack-wrapper {
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0; margin: auto;
            aspect-ratio: 70 / 135; 
            width: min(100vw, 100dvh * (70 / 135));
            height: min(100dvh, 100vw * (135 / 70));
            transform: translateY(150dvh) translate(var(--ox, 0px), var(--oy, 0px)) rotate(var(--rot, 0deg));
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        
        /* 針對 PWA 模式限縮卡包比例至 80% */
        body.is-pwa .pack-wrapper {
            width: min(80vw, 80dvh * (70 / 135));
            height: min(80dvh, 80vw * (135 / 70));
        }
        
        .pack-wrapper.active { 
            transform: translate(var(--ox, 0px), var(--oy, 0px)) rotate(var(--rot, 0deg));
            pointer-events: auto; 
        }
        
        .pack-half {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: 100% 100%; 
            background-position: center; background-repeat: no-repeat;
            transition: transform 0.8s ease-in, opacity 0.8s ease-in;
        }
        .split-left { clip-path: polygon(0 0, 100% 0, 0 100%); }
        .split-right { clip-path: polygon(100% 0, 100% 100%, 0 100%); }

        /* 偵測區域：放大以適應全螢幕卡包 */
        #slash-zone { position: absolute; top: 10%; left: 15%; width: 70%; height: 80%; z-index: 200; pointer-events: auto; }

        /* 3D 翻轉卡片容器 */
        .card-container {
            position: absolute; width: 45dvh; max-width: 250px; aspect-ratio: 63/88; 
            perspective: 1000px; display: none; z-index: 100; opacity: 0;
            transition: opacity 1s ease-out, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translate(-50%, calc(-50% + 50px)) scale(0.5); 
            transform-origin: center center; pointer-events: auto; cursor: pointer;
        }
        .card-container.reveal { opacity: 1; transform: translate(var(--tx, -50%), var(--ty, -50%)) scale(var(--tscale, 1)); }
        
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px;
            background-size: 100% 100%; background-repeat: no-repeat; background-position: center;
        }
        
        .card-back { transform: rotateY(0deg); border: none; border-radius: 12px; overflow: hidden; }
        .card-front { transform: rotateY(180deg); }
        .is-flipped { transform: rotateY(180deg); }

        /* 底部導航 & 共用 Pill 形按鈕 */
        .bottom-nav { 
            position: absolute; bottom: calc(25px + env(safe-area-inset-bottom));
            width: 90%; max-width: 400px; display: flex; justify-content: space-between; align-items: center;
            gap: 10px; pointer-events: auto; z-index: 250; padding: 0 10px; box-sizing: border-box;
        }
        .draw-btn { 
            background: #fff; color: #000; border: none; padding: 10px 5px; font-size: 14px; 
            font-weight: bold; border-radius: 25px; cursor: pointer; white-space: nowrap; flex: 1;
            text-align: center; min-width: 0; 
        }
        .pill-btn { background: transparent; color: #fff; border: 2px solid #fff; border-radius: 50px; padding: 8px 15px; font-size: 14px; font-weight: bold; cursor: pointer; pointer-events: auto; white-space: nowrap; }

        /* 收藏頁面 */
        #collection-screen { justify-content: flex-start; padding-top: calc(20px + env(safe-area-inset-top)); overflow: hidden; box-sizing: border-box; }
        .collection-header { padding: 5px 10px; text-align: center; width: 100%; flex-shrink: 0; pointer-events: auto; }
        .collection-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding: 0 15px; }
        
        /* 系列獎勵面板 */
        #s1-reward-panel { margin: 10px 15px; padding: 12px 15px; background: rgba(255,255,255,0.1); border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; }
        .s1-progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #fff; }
        .s1-progress-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.6); border-radius: 5px; overflow: hidden; margin-bottom: 12px; }
        #s1-progress-bar-fill { height: 100%; background: linear-gradient(90deg, #ffd700, #ffaa00); width: 0%; transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .s1-claim-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .claim-btn { padding: 8px 2px; font-size: 11px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: all 0.3s; text-align: center; white-space: nowrap; }
        .claim-btn.unmet { background: #444; color: #888; cursor: not-allowed; filter: grayscale(1); }
        .claim-btn.ready { background: linear-gradient(45deg, #ffd700, #ff8800); color: #000; box-shadow: 0 0 10px rgba(255, 170, 0, 0.8); animation: pulse-gold 1.5s infinite; }
        .claim-btn.claimed { background: #222; color: #ffd700; border: 1px solid #ffd700; cursor: default; }
        
        #special-badge { font-size: 14px; text-shadow: 0 0 10px #ffd700; animation: float-badge 2s ease-in-out infinite; }
        @keyframes float-badge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes pulse-gold { 0% { box-shadow: 0 0 5px #ffaa00; transform: scale(1); } 50% { box-shadow: 0 0 15px #ffaa00; transform: scale(1.05); } 100% { box-shadow: 0 0 5px #ffaa00; transform: scale(1); } }

        /* 頂部導航分頁 */
        .tab-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; padding: 0 10px; }
        .tab-btn { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.5); padding: 8px 15px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: white; color: black; font-weight: bold; }

        /* 增加 PWA 底部滑動緩衝 */
        #collection-content { flex: 1; width: 100%; max-width: 600px; overflow-y: auto; pointer-events: auto; padding-bottom: calc(30px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
        
        .collection-group-title { text-align: center; font-size: 18px; font-weight: bold; margin: 10px 0; color: #fff; }
        .collection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 15px; }
        
        .card-slot { width: 100%; aspect-ratio: 63/88; background: #222; border-radius: 5px; overflow: hidden; position: relative; }
        .card-slot img { width: 100%; height: 100%; object-fit: fill; }

        /* 全螢幕放大預覽 */
        /* ✅ 修正：移除 hidden class，改用 opacity + pointer-events 控制顯隱 */
        #fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        #fullscreen-overlay.active { opacity: 1; pointer-events: auto; }
        
        #fullscreen-card-img { height: 60dvh; max-height: 600px; aspect-ratio: 63/88; border-radius: 12px; object-fit: fill; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; pointer-events: auto; }

        .long-press-hint { color: #fff; margin-top: 15px; font-size: 14px; font-weight: bold; text-align: center; letter-spacing: 1px; }
        #save-hint { color: #fff; margin-top: 5px; font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s ease; height: 20px; }
        .overlay-controls { margin-top: 10px; display: flex; gap: 10px; pointer-events: auto; }
        
        /* 浮動加鑽動畫 */
        .float-text { position: fixed; color: #00ffff; font-weight: bold; font-size: 24px; text-shadow: 0 0 5px #000; z-index: 1000; pointer-events: none; transition: all 1s ease-out; opacity: 1; }
        
        .tab-section { display: none; }
        .tab-section.active { display: block; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="particle-canvas"></canvas> 

<div id="ui-layer">
    <section id="login-screen" class="screen">
        <div class="select-wrapper">
            <input type="text" id="username-input" placeholder="請輸入玩家名稱" autocomplete="off" />
        </div>
        <button id="btn-enter">開始抽卡</button>
        <button id="btn-install" class="hidden">安裝 Porkémon App</button>

        <div id="ios-install-prompt" class="hidden">
            <span class="close-btn" onclick="this.parentElement.classList.add('hidden')">&times;</span>
            <p style="margin:0; font-weight:bold; font-size:16px;">獲得全螢幕沉浸體驗</p>
            <p style="margin-top:8px; opacity:0.9;">點擊瀏覽器下方「分享」圖標 <br>選擇「加入主畫面」</p>
        </div>
    </section>

    <section id="main-screen" class="screen hidden">
        <div id="top-info">
            <span id="display-username"></span> | 💎 <span id="display-diamonds">0</span>
        </div>

        <div id="god-pack-bg" class="hidden"></div>
        <div id="god-pack-glow" class="hidden"></div>
        
        <div id="stage" onclick="flipAllRemaining()">
            <div id="slash-zone" class="hidden"></div>
        </div>
        
        <div class="bottom-nav hidden" id="action-buttons">
            <button class="draw-btn" onclick="prepareDraw(1)">單抽 3💎</button>
            <button class="draw-btn" onclick="prepareDraw(10)">十連 27💎</button>
            <button class="draw-btn" style="background:none; color:white; border:1px solid white;" onclick="showScreen('collection-screen')">收藏</button>
        </div>
    </section>

    <section id="collection-screen" class="screen hidden">
        <div class="collection-header">
            <div class="collection-controls">
                <button class="pill-btn" onclick="showScreen('main-screen')">返回</button>
                <h2 id="user-title" style="margin: 0; font-size: 18px;"></h2>
                <button class="pill-btn" onclick="resetCollection()" style="border-color: #ff4444; color: #ff4444;">重置</button>
            </div>
            
            <div id="s1-reward-panel">
                <div class="s1-progress-header">
                    <span>Series 1 收集度：<span id="s1-progress-text">0% (0/53)</span></span>
                    <div id="special-badge" class="hidden">🏆 肥豬大師勳章</div>
                </div>
                <div class="s1-progress-bar-bg"><div id="s1-progress-bar-fill"></div></div>
                <div class="s1-claim-buttons">
                    <button id="btn-claim-common" class="claim-btn" onclick="claimReward('common')">未達成</button>
                    <button id="btn-claim-rare" class="claim-btn" onclick="claimReward('rare')">未達成</button>
                    <button id="btn-claim-sr" class="claim-btn" onclick="claimReward('sr')">未達成</button>
                    <button id="btn-claim-special" class="claim-btn" onclick="claimReward('special')">未達成</button>
                </div>
            </div>

            <div class="tab-nav" id="collection-tabs"></div>
        </div>
        <div id="collection-content"></div>
    </section>
</div>

<!-- ✅ 修正：移除 class="hidden"，由 CSS opacity 控制顯隱，避免 display:none 衝突 -->
<div id="fullscreen-overlay">
    <img id="fullscreen-card-img" src="" alt="放大卡片" crossorigin="anonymous">
    <div class="long-press-hint">長按圖片可進行儲存</div>
    <div id="save-hint"></div>
    <div class="overlay-controls">
        <button class="pill-btn" id="btn-share" onclick="shareImage()">分享</button>
        <button class="pill-btn" onclick="downloadImage()">儲存</button>
        <button class="pill-btn" onclick="closeFullscreen()">返回</button>
    </div>
</div>

<script>
    // ---------------- 全域常數與設定 ----------------
    const TOTAL_COMMON = 30;
    const TOTAL_RARE = 15;
    const TOTAL_SUPER_RARE = 5;
    const TOTAL_SPECIAL_LIMITED = 3;
    const SERIES_ID = 'S1';

    const IMAGE_BASE_URL = 'https://8ytxybb7cg-web.github.io/Porkemon/cards/';
    const PACK_IMAGE_URL = 'https://8ytxybb7cg-web.github.io/Porkemon/pack.png';
    const CARD_BACK_URL = 'https://8ytxybb7cg-web.github.io/Porkemon/back.png';

    // Supabase 設定
    const SUPABASE_URL = 'https://vqukywuepntwthuzvngh.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxdWt5d3VlcG50d3RodXp2bmdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg1MTAyNjIsImV4cCI6MjA1NDA4NjI2Mn0.zZ_R0u7U9862419_5_9_2_9_5_9_5_9_5_9_5_9_5_9_5_9_5_9_5_9_5_9_5_9_5_9_5_9_5';
    
    // ✅ 修正：避免與 CDN 全域物件 supabase 同名衝突，改用 supabaseClient
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let collectionData = { common: [], rare: [], super_rare: [], special_limited: [], diamonds: 100, pity_rare_count: 0, rewards_claimed: [] };
    let revealedCount = 0;
    let currentPackCards = [];
    let isDrawing = false;

    // ---------------- 初始化 ----------------
    window.addEventListener('load', () => {
        detectPWA();
        initBackground();
        const savedUser = localStorage.getItem('porkemon_user');
        if (savedUser) {
            document.getElementById('username-input').value = savedUser;
            login();
        }
    });

    function detectPWA() {
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        if (isStandalone) {
            document.body.classList.add('is-pwa');
        } else {
            if (!/iPhone|iPad|iPod/.test(navigator.userAgent)) {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    const installBtn = document.getElementById('btn-install');
                    installBtn.classList.remove('hidden');
                    installBtn.onclick = () => { e.prompt(); };
                });
            } else {
                document.getElementById('ios-install-prompt').classList.remove('hidden');
            }
        }
    }

    async function login() {
        const input = document.getElementById('username-input');
        const name = input.value.trim();
        if (!name) return;

        currentUser = name;
        localStorage.setItem('porkemon_user', name);
        
        // ✅ 修正：使用 supabaseClient 取代 supabase
        const { data, error } = await supabaseClient.from('players').select('*').eq('username', name).single();
        
        if (data) {
            collectionData = data.data || collectionData;
        } else {
            await supabaseClient.from('players').insert([{ username: name, data: collectionData }]);
        }

        updateUI();
        showScreen('main-screen');
    }

    document.getElementById('btn-enter').onclick = login;

    // ---------------- 抽卡核心邏輯 ----------------
    async function prepareDraw(count) {
        if (isDrawing) return;
        const cost = count === 1 ? 3 : 27;
        if (collectionData.diamonds < cost) { alert("鑽石不足！"); return; }

        collectionData.diamonds -= cost;
        isDrawing = true;
        document.getElementById('action-buttons').classList.add('hidden');
        
        currentPackCards = [];
        for (let i = 0; i < count; i++) {
            currentPackCards.push(generateCard());
        }

        await saveProgress();
        updateUI();
        startPackAnimation(count);
    }

    function generateCard() {
        let rand = Math.random() * 100;
        collectionData.pity_rare_count++;

        if (collectionData.pity_rare_count >= 10) {
            collectionData.pity_rare_count = 0;
            return { type: 'rare', id: Math.floor(Math.random() * TOTAL_RARE) + 1 };
        }

        if (rand < 1) return { type: 'special_limited', id: Math.floor(Math.random() * TOTAL_SPECIAL_LIMITED) + 1 };
        if (rand < 6) return { type: 'super_rare', id: Math.floor(Math.random() * TOTAL_SUPER_RARE) + 1 };
        if (rand < 26) {
            collectionData.pity_rare_count = 0;
            return { type: 'rare', id: Math.floor(Math.random() * TOTAL_RARE) + 1 };
        }
        return { type: 'common', id: Math.floor(Math.random() * TOTAL_COMMON) + 1 };
    }

    // ---------------- 動畫與佈局 (3-4-3 優化) ----------------
    function startPackAnimation(count) {
        const stage = document.getElementById('stage');
        stage.innerHTML = '<div id="slash-zone" class="hidden"></div>';
        
        const wrapper = document.createElement('div');
        wrapper.className = 'pack-wrapper active';
        wrapper.innerHTML = `
            <div class="pack-half split-left" style="background-image:url('${PACK_IMAGE_URL}')"></div>
            <div class="pack-half split-right" style="background-image:url('${PACK_IMAGE_URL}')"></div>
        `;
        stage.appendChild(wrapper);

        const slashZone = document.getElementById('slash-zone');
        slashZone.classList.remove('hidden');

        let startX, startY;
        slashZone.ontouchstart = (e) => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; };
        slashZone.ontouchend = (e) => {
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            if (Math.hypot(endX - startX, endY - startY) > 50) {
                openPack(wrapper, count);
            }
        };

        // 桌面端支援滑鼠拖動開包
        slashZone.onmousedown = (e) => { startX = e.clientX; startY = e.clientY; };
        slashZone.onmouseup = (e) => {
            const endX = e.clientX;
            const endY = e.clientY;
            if (Math.hypot(endX - startX, endY - startY) > 50) {
                openPack(wrapper, count);
            }
        };
    }

    function openPack(wrapper, count) {
        document.getElementById('slash-zone').classList.add('hidden');
        const left = wrapper.querySelector('.split-left');
        const right = wrapper.querySelector('.split-right');
        
        left.style.transform = 'translate(-100%, -100%) rotate(-45deg)';
        right.style.transform = 'translate(100%, 100%) rotate(45deg)';
        left.style.opacity = '0';
        right.style.opacity = '0';

        setTimeout(() => {
            wrapper.remove();
            displayCards(count);
        }, 600);
    }

    function displayCards(count) {
        const stage = document.getElementById('stage');
        revealedCount = 0;
        
        const cardWidth = window.innerWidth * 0.26;
        const cardHeight = cardWidth * (88/63);
        
        currentPackCards.forEach((card, index) => {
            const container = document.createElement('div');
            container.className = 'card-container';
            container.style.width = `${cardWidth}px`;
            
            // 3-4-3 佈局邏輯
            let tx, ty;
            const vGap = window.innerHeight * 0.12;
            const hGap = cardWidth * 1.1;
            
            if (count === 1) {
                tx = '0'; ty = '0';
                container.style.width = '60dvh';
                container.style.maxWidth = '300px';
            } else {
                if (index < 3) { // 第一排
                    tx = `${(index - 1) * hGap}px`;
                    ty = `-${vGap * 1.1}px`;
                } else if (index < 7) { // 第二排 (4張)
                    tx = `${(index - 4.5) * hGap}px`;
                    ty = `0px`;
                } else { // 第三排
                    tx = `${(index - 8) * hGap}px`;
                    ty = `${vGap * 1.1}px`;
                }
            }

            container.style.setProperty('--tx', `calc(-50% + ${tx})`);
            container.style.setProperty('--ty', `calc(-50% + ${ty})`);
            container.style.setProperty('--tscale', count === 1 ? '1' : '1');

            const frontImg = `${IMAGE_BASE_URL}${card.type}_${card.id}.png`;
            container.innerHTML = `
                <div class="card-inner">
                    <div class="card-back" style="background-image:url('${CARD_BACK_URL}')"></div>
                    <div class="card-front" style="background-image:url('${frontImg}')"></div>
                </div>
            `;

            container.onclick = (e) => {
                e.stopPropagation();
                if (!container.querySelector('.card-inner').classList.contains('is-flipped')) {
                    revealCard(container, card, count);
                }
            };

            stage.appendChild(container);
            setTimeout(() => {
                container.style.display = 'block';
                setTimeout(() => container.classList.add('reveal'), 50);
            }, index * 100);
        });
    }

    function revealCard(container, card, total) {
        container.querySelector('.card-inner').classList.add('is-flipped');
        
        if (card.type === 'super_rare') container.style.boxShadow = 'var(--purple-glow)';
        if (card.type === 'special_limited') container.style.boxShadow = 'var(--platinum-glow)';

        if (!collectionData[card.type].includes(card.id)) {
            collectionData[card.type].push(card.id);
        }

        revealedCount++;
        if (revealedCount === total) {
            setTimeout(() => {
                document.getElementById('action-buttons').classList.remove('hidden');
                isDrawing = false;
                saveProgress();
            }, 1000);
        }
    }

    function flipAllRemaining() {
        document.querySelectorAll('.card-container.reveal').forEach(c => c.click());
    }

    // ---------------- 分享功能 (合成圖) ----------------
    async function shareImage() {
        const img = document.getElementById('fullscreen-card-img');
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = 1080;
        canvas.height = 1920;

        // 1. 背景 (黑色舞台)
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. 繪製光點 (粒子效果模擬)
        for(let i=0; i<50; i++) {
            ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
            ctx.beginPath();
            ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 3, 0, Math.PI * 2);
            ctx.fill();
        }

        // 3. 繪製 back.png 作為邊飾 (置中淡化)
        const backImg = new Image();
        backImg.crossOrigin = "anonymous";
        backImg.src = CARD_BACK_URL;
        await new Promise(r => backImg.onload = r);
        ctx.globalAlpha = 0.2;
        ctx.drawImage(backImg, canvas.width/2 - 400, canvas.height/2 - 550, 800, 1100);
        ctx.globalAlpha = 1.0;

        // 4. 繪製主角卡牌
        const cardImg = new Image();
        cardImg.crossOrigin = "anonymous";
        cardImg.src = img.src;
        await new Promise(r => cardImg.onload = r);
        
        ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
        ctx.shadowBlur = 50;
        ctx.drawImage(cardImg, canvas.width/2 - 350, canvas.height/2 - 480, 700, 960);

        // 5. 輸出並分享
        canvas.toBlob(async (blob) => {
            const file = new File([blob], 'porkemon_card.png', { type: 'image/png' });
            if (navigator.share) {
                try {
                    await navigator.share({
                        files: [file],
                        title: 'Porkémon 卡牌分享',
                        text: `我抽到了這張卡！快來加入 Porkémon！`
                    });
                } catch (err) { console.log("分享失敗", err); }
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'porkemon_card.png';
                a.click();
            }
        });
    }

    // ---------------- UI 與 工具 ----------------
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if (id === 'collection-screen') renderCollection();
        if (id === 'main-screen') {
            document.getElementById('action-buttons').classList.remove('hidden');
        }
    }

    function updateUI() {
        document.getElementById('display-username').innerText = currentUser;
        document.getElementById('display-diamonds').innerText = collectionData.diamonds;
    }

    async function saveProgress() {
        if (!currentUser) return;
        // ✅ 修正：使用 supabaseClient 取代 supabase
        await supabaseClient.from('players').update({ data: collectionData }).eq('username', currentUser);
    }

    function renderCollection() {
        const content = document.getElementById('collection-content');
        const tabNav = document.getElementById('collection-tabs');
        tabNav.innerHTML = '';
        content.innerHTML = '';

        const tabs = [
            { id: 'common', label: '普通', total: TOTAL_COMMON },
            { id: 'rare', label: '稀有', total: TOTAL_RARE },
            { id: 'super_rare', label: 'SR', total: TOTAL_SUPER_RARE },
            { id: 'special_limited', label: '限定', total: TOTAL_SPECIAL_LIMITED }
        ];

        tabs.forEach(tab => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.innerText = tab.label;
            btn.onclick = () => {
                document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(`sec-${tab.id}`).classList.add('active');
            };
            tabNav.appendChild(btn);

            const section = document.createElement('div');
            section.className = 'tab-section';
            section.id = `sec-${tab.id}`;
            
            let gridHTML = `<div class="collection-grid">`;
            for (let i = 1; i <= tab.total; i++) {
                const owned = collectionData[tab.id].includes(i);
                const imgSrc = owned ? `${IMAGE_BASE_URL}${tab.id}_${i}.png` : CARD_BACK_URL;
                gridHTML += `
                    <div class="card-slot" onclick="${owned ? `openFullscreen('${IMAGE_BASE_URL}${tab.id}_${i}.png')` : ''}">
                        <img src="${imgSrc}" style="${owned ? '' : 'opacity:0.3; filter:grayscale(1);'}">
                    </div>`;
            }
            gridHTML += `</div>`;
            section.innerHTML = gridHTML;
            content.appendChild(section);
        });
        
        // 預設顯示第一個分頁
        if (tabNav.firstChild) tabNav.firstChild.click();
        updateCollectionProgress();
    }

    function updateCollectionProgress() {
        const totalOwned = collectionData.common.length + collectionData.rare.length + collectionData.super_rare.length + collectionData.special_limited.length;
        const totalPossible = TOTAL_COMMON + TOTAL_RARE + TOTAL_SUPER_RARE + TOTAL_SPECIAL_LIMITED;
        const percent = Math.floor((totalOwned / totalPossible) * 100);
        document.getElementById('s1-progress-bar-fill').style.width = `${percent}%`;
        document.getElementById('s1-progress-text').innerText = `${percent}% (${totalOwned}/${totalPossible})`;
        updateClaimButtons();
    }

    function updateClaimButtons() {
        const rewards = [
            { id: 'btn-claim-common', key: 'common', total: TOTAL_COMMON, rewardKey: 'common', label: `集齊普通 +10💎` },
            { id: 'btn-claim-rare', key: 'rare', total: TOTAL_RARE, rewardKey: 'rare', label: `集齊稀有 +20💎` },
            { id: 'btn-claim-sr', key: 'super_rare', total: TOTAL_SUPER_RARE, rewardKey: 'sr', label: `集齊SR +30💎` },
            { id: 'btn-claim-special', key: 'special_limited', total: TOTAL_SPECIAL_LIMITED, rewardKey: 'special', label: `集齊限定 +50💎` },
        ];

        rewards.forEach(r => {
            const btn = document.getElementById(r.id);
            const owned = collectionData[r.key].length;
            const claimed = collectionData.rewards_claimed && collectionData.rewards_claimed.includes(r.rewardKey);
            
            if (claimed) {
                btn.className = 'claim-btn claimed';
                btn.innerText = '已領取 ✓';
            } else if (owned >= r.total) {
                btn.className = 'claim-btn ready';
                btn.innerText = r.label;
            } else {
                btn.className = 'claim-btn unmet';
                btn.innerText = `${owned}/${r.total}`;
            }
        });

        // 全收集勳章
        const allOwned = collectionData.common.length >= TOTAL_COMMON &&
                         collectionData.rare.length >= TOTAL_RARE &&
                         collectionData.super_rare.length >= TOTAL_SUPER_RARE &&
                         collectionData.special_limited.length >= TOTAL_SPECIAL_LIMITED;
        document.getElementById('special-badge').classList.toggle('hidden', !allOwned);
    }

    function claimReward(rewardKey) {
        const rewardMap = { common: 10, rare: 20, sr: 30, special: 50 };
        const collectionMap = { common: { key: 'common', total: TOTAL_COMMON }, rare: { key: 'rare', total: TOTAL_RARE }, sr: { key: 'super_rare', total: TOTAL_SUPER_RARE }, special: { key: 'special_limited', total: TOTAL_SPECIAL_LIMITED } };
        
        const info = collectionMap[rewardKey];
        if (!info) return;

        if (!collectionData.rewards_claimed) collectionData.rewards_claimed = [];
        if (collectionData.rewards_claimed.includes(rewardKey)) return;
        if (collectionData[info.key].length < info.total) return;

        const diamonds = rewardMap[rewardKey];
        collectionData.diamonds += diamonds;
        collectionData.rewards_claimed.push(rewardKey);
        
        saveProgress();
        updateUI();
        updateCollectionProgress();
    }

    function openFullscreen(src) {
        const overlay = document.getElementById('fullscreen-overlay');
        const img = document.getElementById('fullscreen-card-img');
        img.src = src;
        overlay.classList.add('active');
    }

    function closeFullscreen() {
        document.getElementById('fullscreen-overlay').classList.remove('active');
    }

    function downloadImage() {
        const src = document.getElementById('fullscreen-card-img').src;
        const a = document.createElement('a');
        a.href = src;
        a.download = 'porkemon_card.png';
        a.click();
    }

    function initBackground() {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            requestAnimationFrame(draw);
        }
        draw();
    }

    async function resetCollection() {
        if (confirm("確定要重置所有進度嗎？此操作無法還原。")) {
            collectionData = { common: [], rare: [], super_rare: [], special_limited: [], diamonds: 100, pity_rare_count: 0, rewards_claimed: [] };
            await saveProgress();
            location.reload();
        }
    }
</script>
