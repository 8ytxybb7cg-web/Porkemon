<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://8ytxybb7cg-web.github.io/Porkemon/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    
    <title>抽肥豬卡 - Porkémon</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* 光環顏色定義 */
            --blue-glow: 0 0 20px #0055ff, 0 0 40px #00aaff, 0 0 80px #88ddff;
            --purple-glow: 0 0 20px #a020f0, 0 0 40px #c020f0, 0 0 80px #e020f0;
            --gold-glow: 0 0 20px #ffd700, 0 0 40px #ffaa00, 0 0 80px #ff8800;
            --red-glow: 0 0 20px #ff0000, 0 0 40px #ff4444, 0 0 80px #ff8888;
            --platinum-glow: 0 0 20px #ffffff, 0 0 40px #e5e4e2, 0 0 80px #fffafa, 0 0 100px #ffffff;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; 
            background-color: #000; color: white;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; touch-action: none;
            overscroll-behavior: none; -webkit-touch-callout: none; 
        }

        /* 背景與 UI 層次 */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
        #ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }

        .screen { 
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            width: 100%; height: 100%; min-height: 0; position: relative;
        }
        .hidden { display: none !important; }

        /* PWA 安裝按鈕與提示 (玻璃質感) */
        #btn-install { 
            background: linear-gradient(45deg, #444, #222); border: 1.5px solid #fff; color: #fff; 
            padding: 10px 40px; font-size: 16px; cursor: pointer; pointer-events: auto; 
            transition: opacity 0.3s; margin-top: 15px; border-radius: 25px; box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }
        #ios-install-prompt {
            position: absolute; bottom: calc(30px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 320px; padding: 20px 15px;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px;
            text-align: center; color: white; z-index: 1000; font-size: 15px; line-height: 1.6;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); pointer-events: auto;
        }
        #ios-install-prompt .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; font-weight: bold; color: rgba(255,255,255,0.6); }

        /* 玩家狀態資訊條 */
        #top-info {
            position: absolute; top: calc(20px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px;
            border: 1px solid #fff; font-size: 18px; font-weight: bold;
            z-index: 200; pointer-events: auto; white-space: nowrap; box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* 金色玩家名稱特效 */
        .golden-name {
            background: linear-gradient(45deg, #ffd700, #ffaa00, #fffafa); -webkit-background-clip: text;
            color: transparent; text-shadow: 0 0 10px rgba(255, 215, 0, 0.6); font-weight: 900 !important; letter-spacing: 1px;
        }

        /* God Pack 專屬彩虹背景特效 */
        #god-pack-bg {
            position: absolute; top: 50%; left: 50%; width: 250vw; height: 250vh;
            transform: translate(-50%, -50%); background: conic-gradient(from 0deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000);
            animation: spin-rainbow 4s linear infinite; opacity: 0.6; z-index: -2; pointer-events: none;
        }
        #god-pack-glow {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.9) 0%, rgba(255,255,255,0) 65%);
            z-index: -1; pointer-events: none; animation: pulse-glow 2s ease-in-out infinite alternate;
        }
        @keyframes spin-rainbow { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
        @keyframes pulse-glow { from { opacity: 0.5; } to { opacity: 1; } }

        /* 身份選擇 */
        .select-wrapper { position: relative; margin-bottom: 50px; pointer-events: auto; display: inline-block; }
        #username-input {
            background: transparent; border: none; border-bottom: 2px solid #fff;
            color: white; font-size: 32px; font-weight: bold; padding: 10px 20px;
            text-align: center; outline: none; width: 250px;
        }
        #username-input::placeholder { color: rgba(255,255,255,0.4); font-size: 24px; }
        
        #btn-enter { background: transparent; border: 1.5px solid #fff; color: #fff; padding: 10px 40px; font-size: 18px; cursor: pointer; pointer-events: auto; transition: opacity 0.3s; }
        #btn-enter:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 抽卡舞台 */
        #stage { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: auto; }

        /* ==============================
           修改 4：PWA 卡包尺寸限制 ~80% 螢幕
           網頁版維持原本全螢幕最大化，PWA 才縮小
           ============================== */
        .pack-wrapper {
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0; margin: auto;
            aspect-ratio: 70 / 135; 
            /* 預設（網頁）維持原本行為 */
            width: min(100vw, 100dvh * (70 / 135));
            height: min(100dvh, 100vw * (135 / 70));
            transform: translateY(150dvh) translate(var(--ox, 0px), var(--oy, 0px)) rotate(var(--rot, 0deg));
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        
        /* PWA 模式：限制卡包約 80% 螢幕，避免遮住狀態列 */
        @media all and (display-mode: standalone) {
            .pack-wrapper {
                width: min(80vw, 80dvh * (70 / 135));
                height: min(80dvh, 80vw * (135 / 70));
            }
        }
        
        .pack-wrapper.active { 
            transform: translate(var(--ox, 0px), var(--oy, 0px)) rotate(var(--rot, 0deg));
            pointer-events: auto; 
        }
        
        .pack-half {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: 100% 100%; 
            background-position: center; background-repeat: no-repeat;
            transition: transform 0.8s ease-in, opacity 0.8s ease-in;
        }
        .split-left { clip-path: polygon(0 0, 100% 0, 0 100%); }
        .split-right { clip-path: polygon(100% 0, 100% 100%, 0 100%); }

        /* 偵測區域：放大以適應全螢幕卡包 */
        #slash-zone { position: absolute; top: 10%; left: 15%; width: 70%; height: 80%; z-index: 200; pointer-events: auto; }

        /* ==============================
           修改 1 & 2：十連抽卡牌尺寸與間距調整
           放大縮圖、縮短上下間距、底排與按鍵拉開距離
           ============================== */
        .card-container {
            position: absolute;
            /* 修改 2：放大至 28vw，最大值提升至 120px */
            width: 28vw;
            max-width: 120px;
            aspect-ratio: 63/88; 
            perspective: 1000px; display: none; z-index: 100; opacity: 0;
            transition: opacity 1s ease-out, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translate(-50%, calc(-50% + 50px)) scale(0.5); 
            transform-origin: center center; pointer-events: auto; cursor: pointer;
        }
        .card-container.reveal { opacity: 1; transform: translate(var(--tx, -50%), var(--ty, -50%)) scale(var(--tscale, 1)); }
        
        .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.8s; transform-style: preserve-3d; }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px;
            background-size: 100% 100%; background-repeat: no-repeat; background-position: center;
        }
        
        .card-back { transform: rotateY(0deg); border: none; border-radius: 12px; overflow: hidden; }
        .card-front { transform: rotateY(180deg); }
        .is-flipped { transform: rotateY(180deg); }

        /* 底部導航 & 共用 Pill 形按鈕 */
        .bottom-nav { 
            position: absolute; bottom: calc(25px + env(safe-area-inset-bottom));
            width: 90%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; 
            gap: 10px; pointer-events: auto; z-index: 250; padding: 0 10px; box-sizing: border-box;
        }
        .draw-btn { 
            background: #fff; color: #000; border: none; padding: 10px 5px; font-size: 14px; 
            font-weight: bold; border-radius: 25px; cursor: pointer; white-space: nowrap; flex: 1;
            text-align: center; min-width: 0; 
        }
        
        .pill-btn { background: transparent; color: #fff; border: 2px solid #fff; border-radius: 50px; padding: 8px 20px; font-size: 16px; font-weight: bold; cursor: pointer; pointer-events: auto; }

        /* 收藏頁面 */
        #collection-screen { justify-content: flex-start; padding-top: calc(20px + env(safe-area-inset-top)); overflow: hidden; box-sizing: border-box; }
        .collection-header { padding: 5px 10px; text-align: center; width: 100%; flex-shrink: 0; pointer-events: auto; }
        .collection-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding: 0 15px; }
        
        /* 系列獎勵面板 */
        #s1-reward-panel { margin: 10px 15px; padding: 12px 15px; background: rgba(255,255,255,0.1); border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; }
        .s1-progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #fff; }
        .s1-progress-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.6); border-radius: 5px; overflow: hidden; margin-bottom: 12px; }
        #s1-progress-bar-fill { height: 100%; background: linear-gradient(90deg, #ffd700, #ffaa00); width: 0%; transition: width 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .s1-claim-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .claim-btn { padding: 8px 2px; font-size: 11px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: all 0.3s; text-align: center; white-space: nowrap; }
        .claim-btn.unmet { background: #444; color: #888; cursor: not-allowed; filter: grayscale(1); }
        .claim-btn.ready { background: linear-gradient(45deg, #ffd700, #ff8800); color: #000; box-shadow: 0 0 10px rgba(255, 170, 0, 0.8); animation: pulse-gold 1.5s infinite; }
        .claim-btn.claimed { background: #222; color: #ffd700; border: 1px solid #ffd700; cursor: default; }
        
        #special-badge { font-size: 14px; text-shadow: 0 0 10px #ffd700; animation: float-badge 2s ease-in-out infinite; }
        @keyframes float-badge { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
        @keyframes pulse-gold { 0% { box-shadow: 0 0 5px #ffaa00; transform: scale(1); } 50% { box-shadow: 0 0 15px #ffaa00; transform: scale(1.05); } 100% { box-shadow: 0 0 5px #ffaa00; transform: scale(1); } }

        /* 頂部導航分頁 */
        .tab-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; padding: 0 10px; }
        .tab-btn { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.5); padding: 8px 15px; border-radius: 20px; font-size: 14px; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: white; color: black; font-weight: bold; }

        /* 增加 PWA 底部滑動緩衝 */
        #collection-content { flex: 1; width: 100%; max-width: 600px; overflow-y: auto; pointer-events: auto; padding-bottom: calc(30px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
        
        .collection-group-title { text-align: center; font-size: 18px; font-weight: bold; margin: 10px 0; color: #fff; }
        .collection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0 15px; }
        
        .card-slot { width: 100%; aspect-ratio: 63/88; background: #222; border-radius: 5px; overflow: hidden; position: relative; }
        .card-slot img { width: 100%; height: 100%; object-fit: fill; }

        /* ==============================
           修改 3：全螢幕放大預覽 + 分享功能
           ============================== */
        #fullscreen-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        #fullscreen-overlay.active { opacity: 1; pointer-events: auto; }
        
        #fullscreen-card-img { height: 60dvh; max-height: 600px; aspect-ratio: 63/88; border-radius: 12px; object-fit: fill; -webkit-user-select: auto; user-select: auto; -webkit-touch-callout: default; pointer-events: auto; }

        .long-press-hint { color: #fff; margin-top: 15px; font-size: 16px; font-weight: bold; text-align: center; letter-spacing: 1px; }
        #save-hint { color: #fff; margin-top: 5px; font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s ease; height: 20px; }
        .overlay-controls { margin-top: 10px; display: flex; gap: 10px; pointer-events: auto; flex-wrap: wrap; justify-content: center; }
        
        /* 分享面板 */
        #share-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; z-index: 10001;
            background: rgba(20,20,20,0.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.15); border-radius: 20px 20px 0 0;
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
            transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.175,0.885,0.32,1.1);
            box-sizing: border-box;
        }
        #share-panel.open { transform: translateY(0); }
        #share-panel-title { text-align: center; font-size: 16px; color: rgba(255,255,255,0.6); margin-bottom: 18px; }
        .share-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .share-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; pointer-events: auto; }
        .share-icon { width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 26px; transition: transform 0.15s; }
        .share-icon:active { transform: scale(0.9); }
        .share-label { font-size: 11px; color: rgba(255,255,255,0.7); white-space: nowrap; }
        .share-icon.whatsapp { background: #25D366; }
        .share-icon.instagram { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .share-icon.threads { background: #000; border: 1px solid #444; }
        .share-icon.x-twitter { background: #000; border: 1px solid #444; }
        .share-icon.copy-link { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); }
        #share-panel-close { width: 100%; margin-top: 16px; padding: 12px; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 16px; border-radius: 12px; cursor: pointer; }
        #share-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: transparent; z-index: 10000; display: none; }
        #share-backdrop.open { display: block; }

        /* 浮動加鑽動畫 */
        .float-text { position: fixed; color: #00ffff; font-weight: bold; font-size: 24px; text-shadow: 0 0 5px #000; z-index: 1000; pointer-events: none; transition: all 1s ease-out; opacity: 1; }
        
        .tab-section { display: none; }
        .tab-section.active { display: block; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="particle-canvas"></canvas> 

<div id="ui-layer">
    <section id="login-screen" class="screen">
        <div class="select-wrapper">
            <input type="text" id="username-input" placeholder="請輸入玩家名稱" autocomplete="off" />
        </div>
        <button id="btn-enter">開始抽卡</button>
        <button id="btn-install" class="hidden">安裝 Porkémon App</button>

        <div id="ios-install-prompt" class="hidden">
            <span class="close-btn" onclick="this.parentElement.classList.add('hidden')">&times;</span>
            <p style="margin:0; font-weight:bold; font-size:16px;">獲得全螢幕沉浸體驗</p>
            <p style="margin-top:8px; opacity:0.9;">點擊瀏覽器下方「分享」圖標 <br>選擇「加入主畫面」</p>
        </div>
    </section>

    <section id="main-screen" class="screen hidden">
        <div id="top-info">
            <span id="display-username"></span> | 💎 <span id="display-diamonds">0</span>
        </div>

        <div id="god-pack-bg" class="hidden"></div>
        <div id="god-pack-glow" class="hidden"></div>
        
        <div id="stage" onclick="flipAllRemaining()">
            <div id="slash-zone" class="hidden"></div>
        </div>
        
        <div class="bottom-nav hidden" id="action-buttons">
            <button class="draw-btn" onclick="prepareDraw(1)">單抽 3💎</button>
            <button class="draw-btn" onclick="prepareDraw(10)">十連 27💎</button>
            <button class="draw-btn" style="background:none; color:white; border:1px solid white;" onclick="showScreen('collection-screen')">收藏</button>
        </div>
    </section>

    <section id="collection-screen" class="screen hidden">
        <div class="collection-header">
            <div class="collection-controls">
                <button class="pill-btn" onclick="showScreen('main-screen')">返回</button>
                <h2 id="user-title" style="margin: 0; font-size: 18px;"></h2>
                <button class="pill-btn" onclick="resetCollection()" style="border-color: #ff4444; color: #ff4444;">重置</button>
            </div>
            
            <div id="s1-reward-panel">
                <div class="s1-progress-header">
                    <span>Series 1 收集度：<span id="s1-progress-text">0% (0/53)</span></span>
                    <div id="special-badge" class="hidden">🏆 肥豬大師勳章</div>
                </div>
                <div class="s1-progress-bar-bg"><div id="s1-progress-bar-fill"></div></div>
                <div class="s1-claim-buttons">
                    <button id="btn-claim-common" class="claim-btn" onclick="claimReward('common')">未達成</button>
                    <button id="btn-claim-rare" class="claim-btn" onclick="claimReward('rare')">未達成</button>
                    <button id="btn-claim-sr" class="claim-btn" onclick="claimReward('sr')">未達成</button>
                    <button id="btn-claim-special" class="claim-btn" onclick="claimReward('special')">未達成</button>
                </div>
            </div>

            <div class="tab-nav" id="collection-tabs"></div>
        </div>
        <div id="collection-content"></div>
    </section>
</div>

<div id="fullscreen-overlay" class="hidden">
    <img id="fullscreen-card-img" src="" alt="放大卡片">
    <div class="long-press-hint">長按圖片可進行儲存</div>
    <div id="save-hint"></div>
    <div class="overlay-controls">
        <button class="pill-btn" onclick="openSharePanel()">分享</button>
        <button class="pill-btn" onclick="downloadImage()">儲存</button>
        <button class="pill-btn" onclick="closeFullscreen()">返回</button>
    </div>
</div>

<!-- 分享遮罩 -->
<div id="share-backdrop" onclick="closeSharePanel()"></div>

<!-- 分享面板 -->
<div id="share-panel">
    <div id="share-panel-title">分享卡片</div>
    <div class="share-grid">
        <div class="share-item" onclick="shareToApp('whatsapp')">
            <div class="share-icon whatsapp">
                <svg width="28" height="28" viewBox="0 0 32 32" fill="white"><path d="M16 2C8.28 2 2 8.28 2 16c0 2.46.66 4.78 1.8 6.78L2 30l7.44-1.76C11.3 29.36 13.6 30 16 30c7.72 0 14-6.28 14-14S23.72 2 16 2zm0 25.5c-2.18 0-4.22-.6-5.96-1.64l-.42-.26-4.42 1.04 1.08-4.28-.28-.44A11.46 11.46 0 014.5 16C4.5 9.6 9.6 4.5 16 4.5S27.5 9.6 27.5 16 22.4 27.5 16 27.5zm6.3-8.56c-.34-.18-2.02-1-2.34-1.1-.32-.12-.54-.18-.78.18-.22.34-.88 1.1-1.08 1.32-.2.22-.4.24-.74.08-.34-.18-1.44-.54-2.74-1.7-1.02-.9-1.7-2.02-1.9-2.36-.2-.34-.02-.52.14-.68.16-.16.34-.4.52-.6.18-.2.22-.34.34-.56.12-.22.06-.42-.02-.6-.08-.18-.78-1.88-1.06-2.56-.28-.68-.56-.58-.78-.6H11.9c-.22 0-.58.08-.88.4-.3.32-1.14 1.1-1.14 2.7s1.16 3.14 1.32 3.36c.18.22 2.3 3.5 5.56 4.9.78.34 1.38.54 1.86.68.78.24 1.5.2 2.06.12.62-.1 1.92-.78 2.2-1.54.28-.76.28-1.4.2-1.54-.08-.14-.3-.22-.62-.4z"/></svg>
            </div>
            <span class="share-label">WhatsApp</span>
        </div>
        <div class="share-item" onclick="shareToApp('instagram')">
            <div class="share-icon instagram">

<script>
    // ==========================================
    // 1. 全域變數與基礎設定
    // ==========================================
    const BASE_URL = "https://cdn.jsdelivr.net/gh/8ytxybb7cg-web/Porkemon@main/";
    const IMG_PACK = BASE_URL + "packs/pack.png";
    const IMG_BACK = BASE_URL + "back/back.png";
    
    // 抽卡池總數
    const TOTAL_COMMON = 33;
    const TOTAL_RARE = 14;
    const TOTAL_SUPER_RARE = 9;
    const TOTAL_SPECIAL_LIMITED = 3; 

    // Series 1 成就判定標準 (前端邏輯鎖定)
    const S1_TOTALS = { common: 28, rare: 14, super_rare: 9, special_limited: 2 };
    const EVENT_ACTIVE = true; 

    let currentUser = "";
    let currentCollectionData = { 
        common: [], rare: [], super_rare: [], special_limited: [], 
        diamonds: 0, pity_rare_count: 0,
        rewards_claimed: { s1_common: false, s1_rare: false, s1_sr: false, s1_special: false }
    };
    let lastLoginDate = null;
    let hasSpecialGlobal = false;
    
    let drawnCards = [];
    let flippedCount = 0;
    let isSlashing = false;
    let gameState = "login";
    let isCurrentDrawGodPack = false;

    // ==========================================
    // 本地記憶與 PWA 初始化 (自動登入)
    // ==========================================
    window.onload = () => {
        const savedName = localStorage.getItem('porkemon_username');
        if (savedName) {
            document.getElementById('username-input').value = savedName;
            document.getElementById('btn-enter').click();
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker 註冊成功 (v2.1)'))
                .catch(err => console.error('Service Worker 註冊失敗', err));
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (!savedName) {
                const installBtn = document.getElementById('btn-install');
                installBtn.classList.remove('hidden');
                installBtn.onclick = async () => {
                    installBtn.classList.add('hidden');
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                };
            }
        });

        const isIos = () => /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
        const isInStandaloneMode = () => ('standalone' in window.navigator) && window.navigator.standalone;
        if (isIos() && !isInStandaloneMode() && !savedName) {
            document.getElementById('ios-install-prompt').classList.remove('hidden');
        }
    };

    // ==========================================
    // 2. Canvas 渲染邏輯
    // ==========================================
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    
    let flyingBacks = [];
    let baseParticles = [];
    let blastParticles = [];
    let slashPath = [];

    const backImgObj = new Image();
    backImgObj.src = IMG_BACK;

    function resizeCanvas() {
        bgCanvas.width = pCanvas.width = window.innerWidth;
        bgCanvas.height = pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for(let i=0; i<60; i++) {
        baseParticles.push({ x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height, s: Math.random()*2, v: 0.5+Math.random()*1 });
    }
    for(let i=0; i<12; i++) {
        flyingBacks.push({
            x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height,
            r: Math.random()*Math.PI*2, s: 0.3 + Math.random()*0.4,
            vx: (Math.random()-0.5)*1.5, vy: (Math.random()-0.5)*1.5, vr: (Math.random()-0.5)*0.03
        });
    }

    function renderLoop() {
        try {
            bgCtx.fillStyle = '#000';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            const grad = bgCtx.createRadialGradient(bgCanvas.width/2, bgCanvas.height/3, 50, bgCanvas.width/2, bgCanvas.height/3, bgCanvas.width*0.8);
            grad.addColorStop(0, '#1a1a1a'); grad.addColorStop(1, '#000');
            bgCtx.fillStyle = grad;
            bgCtx.fillRect(0,0, bgCanvas.width, bgCanvas.height);

            bgCtx.fillStyle = 'rgba(255,255,255,0.4)';
            baseParticles.forEach(p => {
                p.y -= p.v;
                if(p.y < 0) p.y = bgCanvas.height;
                bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); bgCtx.fill();
            });

            if(gameState === 'drawing') {
                flyingBacks.forEach(c => {
                    c.x += c.vx; c.y += c.vy; c.r += c.vr;
                    if(c.x < -100) c.x = bgCanvas.width+100; if(c.x > bgCanvas.width+100) c.x = -100;
                    if(c.y < -100) c.y = bgCanvas.height+100; if(c.y > bgCanvas.height+100) c.y = -100;
                    
                    bgCtx.save();
                    bgCtx.translate(c.x, c.y); bgCtx.rotate(c.r); bgCtx.globalAlpha = 0.2;
                    if(backImgObj.complete) bgCtx.drawImage(backImgObj, -50*c.s, -70*c.s, 100*c.s, 140*c.s);
                    bgCtx.restore();
                });
            }

            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

            if(isSlashing && slashPath.length > 1) {
                pCtx.shadowBlur = 20;
                pCtx.shadowColor = "#fff"; pCtx.strokeStyle = "#fff";
                pCtx.lineWidth = 6; pCtx.lineCap = "round";
                pCtx.beginPath(); pCtx.moveTo(slashPath[0].x, slashPath[0].y);
                slashPath.forEach(p => pCtx.lineTo(p.x, p.y)); pCtx.stroke();
                pCtx.shadowBlur = 0;
            }

            for(let i=blastParticles.length-1; i>=0; i--) {
                let p = blastParticles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                if(p.life <= 0) { blastParticles.splice(i, 1); continue; }
                pCtx.fillStyle = p.color;
                pCtx.globalAlpha = p.life;
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); pCtx.fill();
            }
            pCtx.globalAlpha = 1;
        } catch (error) {}

        requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    // ==========================================
    // 3. Supabase 安全連線初始化
    // ==========================================
    const SUPABASE_URL = 'https://myrhatzdypiwwgmmfbuw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im15cmhhdHpkeXBpd3dnbW1mYnV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU1MTM4NzUsImV4cCI6MjA4MTA4OTg3NX0.s6w2f3pKovuFYkR09bLvPBVJUa6b3Uw2gIXrlw9teb8'; 

    let supabaseClient = null;
    try {
        if (typeof window.supabase !== 'undefined') {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else {
            console.error("未能載入 Supabase 核心套件");
        }
    } catch(err) {
        console.error("Supabase 初始化失敗:", err);
    }

    // ==========================================
    // 4. 資料庫邏輯與 UI 更新
    // ==========================================
    function giveInitialDiamondsIfNeeded() {
        if (!currentCollectionData.diamonds) {
            currentCollectionData.diamonds = 0;
        }
        if (!lastLoginDate) {
            currentCollectionData.diamonds = 300;
            lastLoginDate = new Date().toISOString();
            currentCollectionData.lastLoginDate = lastLoginDate; 
            setTimeout(() => { alert("🎉 歡迎新玩家！已發放初始 300 💎"); }, 200);
            return true;
        }
        return false;
    }

    function checkDailyReset() {
        const now = new Date();
        const baseline = new Date(now);
        
        if (now.getHours() >= 8) {
            baseline.setHours(8, 0, 0, 0);
        } else {
            baseline.setDate(baseline.getDate() - 1);
            baseline.setHours(8, 0, 0, 0);
        }

        const lastLogin = lastLoginDate ? new Date(lastLoginDate) : new Date(0);
        
        if (lastLogin < baseline && lastLoginDate !== null) { 
            currentCollectionData.diamonds = (currentCollectionData.diamonds || 0) + 100;
            if (currentCollectionData.diamonds > 99999) currentCollectionData.diamonds = 99999;
            lastLoginDate = now.toISOString();
            currentCollectionData.lastLoginDate = lastLoginDate;
            setTimeout(() => { alert("🎉 每日登入獎勵！已領取 100 💎"); }, 200);
            return true;
        }
        return false;
    }

    function updateDiamondUI() {
        const nameEl = document.getElementById('display-username');
        const titleEl = document.getElementById('user-title');
        
        nameEl.innerText = currentUser;
        titleEl.innerText = currentUser + " 的收藏";
        document.getElementById('display-diamonds').innerText = currentCollectionData.diamonds || 0;
        if (hasSpecialGlobal) {
            nameEl.classList.add('golden-name');
            titleEl.classList.add('golden-name');
        } else {
            nameEl.classList.remove('golden-name');
            titleEl.classList.remove('golden-name');
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');

        if(id === 'collection-screen') {
            isCurrentDrawGodPack = false;
            document.getElementById('god-pack-bg').classList.add('hidden');
            document.getElementById('god-pack-glow').classList.add('hidden');
            document.body.style.touchAction = 'pan-y'; 
            updateCollectionUI();
            document.getElementById('action-buttons').classList.remove('hidden');
        } else if (id === 'main-screen' && drawnCards.length === 0) {
            document.getElementById('action-buttons').classList.remove('hidden');
            document.getElementById('top-info').classList.remove('hidden');
            document.body.style.touchAction = 'none';
        } else {
            document.body.style.touchAction = 'none';
        }
    }

    document.getElementById('btn-enter').onclick = async () => {
        const nameVal = document.getElementById('username-input').value.trim();
        if (!nameVal) { alert("請輸入玩家名稱！"); return; }

        currentUser = nameVal;
        localStorage.setItem('porkemon_username', currentUser);
        const btn = document.getElementById('btn-enter');
        btn.innerText = "連線資料庫中...";
        btn.disabled = true;

        try {
            if (!supabaseClient) throw new Error("資料庫模組未能啟動。");
            const { data, error } = await supabaseClient
                .from('user_collections')
                .select('*')
                .eq('username', currentUser)
                .maybeSingle();

            if (error) throw error;

            if (data) {
                currentCollectionData = data.collection || { common: [], rare: [], super_rare: [], special_limited: [] };
                currentCollectionData.diamonds = data.diamonds !== null && data.diamonds !== undefined ? data.diamonds : (currentCollectionData.diamonds || 0);
                lastLoginDate = currentCollectionData.lastLoginDate || null;
                currentCollectionData.pity_rare_count = data.pity_rare_count !== undefined ? data.pity_rare_count : (currentCollectionData.pity_rare_count || 0);
                hasSpecialGlobal = data.has_special || false;
            } else {
                currentCollectionData = { common: [], rare: [], super_rare: [], special_limited: [], diamonds: 0, pity_rare_count: 0 };
                lastLoginDate = null;
                hasSpecialGlobal = false;
            }

            if(!currentCollectionData.special_limited) currentCollectionData.special_limited = [];
            if(!currentCollectionData.super_rare) currentCollectionData.super_rare = [];
            if(!currentCollectionData.rare) currentCollectionData.rare = [];
            if(!currentCollectionData.common) currentCollectionData.common = [];

            if(!currentCollectionData.rewards_claimed) {
                currentCollectionData.rewards_claimed = { s1_common: false, s1_rare: false, s1_sr: false, s1_special: false };
            }
            if(typeof currentCollectionData.pity_rare_count === 'undefined') currentCollectionData.pity_rare_count = 0;

            let isInitial = giveInitialDiamondsIfNeeded();
            let isUpdated = false;
            
            if (!isInitial) {
                isUpdated = checkDailyReset();
            }

            updateDiamondUI();

            if (!data || isInitial || isUpdated) {
                await saveUserData();
            }

        } catch (err) {
            console.error("Supabase 發生例外狀況:", err);
            alert("雲端同步異常...\n\n自動啟用「單機離線模式」。");
            currentCollectionData = { 
                common: [], rare: [], super_rare: [], special_limited: [], diamonds: 300, pity_rare_count: 0,
                rewards_claimed: { s1_common: false, s1_rare: false, s1_sr: false, s1_special: false }
            };
            lastLoginDate = new Date().toISOString();
            hasSpecialGlobal = false;
            updateDiamondUI();
        } finally {
            gameState = 'drawing';
            showScreen('main-screen');
            btn.innerText = "開始抽卡";
            btn.disabled = false;
        }
    };

    async function saveUserData() {
        if (!supabaseClient) return;
        currentCollectionData.lastLoginDate = lastLoginDate;
        try {
            await supabaseClient
                .from('user_collections')
                .upsert({ 
                    username: currentUser,
                    collection: currentCollectionData, 
                    diamonds: currentCollectionData.diamonds,
                    pity_rare_count: currentCollectionData.pity_rare_count,
                    has_special: hasSpecialGlobal, 
                    updated_at: new Date().toISOString() 
                });
        } catch (err) {
            console.error("背景儲存發生錯誤:", err);
        }
    }

    // ==========================================
    // 5. 抽卡邏輯
    // ==========================================
    function prepareDraw(num) {
        const cost = num === 1 ? 3 : 27;
        if (currentCollectionData.diamonds < cost) {
            alert("💎 鑽石不足！\n每日 08:00 重置將發放 30 💎");
            return;
        }

        currentCollectionData.diamonds -= cost;
        updateDiamondUI();

        document.getElementById('action-buttons').classList.add('hidden');
        document.getElementById('top-info').classList.add('hidden');

        const stage = document.getElementById('stage');
        Array.from(stage.children).forEach(child => {
            if(child.id !== 'slash-zone') child.remove();
        });
        
        drawnCards = [];
        flippedCount = 0;
        isCurrentDrawGodPack = false;
        document.getElementById('god-pack-bg').classList.add('hidden');
        document.getElementById('god-pack-glow').classList.add('hidden');
        
        const zone = document.getElementById('slash-zone');
        zone.classList.add('hidden');

        if (num === 10) {
            if (Math.random() < 0.005) {
                isCurrentDrawGodPack = true;
                currentCollectionData.pity_rare_count = 0; 

                let selectedCards = [];
                const addFromPool = (type, maxTotal) => {
                    let available = Array.from({length: maxTotal}, (_, i) => (i + 1).toString().padStart(3, '0'));
                    available.sort(() => Math.random() - 0.5); 
                    for (let id of available) {
                        if (selectedCards.length < 10) {
                            selectedCards.push({ type: type, id: id, isGodPack: true });
                        }
                    }
                };
                if (EVENT_ACTIVE) addFromPool('special_limited', TOTAL_SPECIAL_LIMITED);
                addFromPool('super_rare', TOTAL_SUPER_RARE);
                addFromPool('rare', TOTAL_RARE);

                selectedCards.sort(() => Math.random() - 0.5);
                drawnCards = selectedCards;
            } else {
                let hasRareOrAbove = false;
                for(let i=0; i<10; i++) {
                    const rand = Math.random();
                    let cardType, maxId;
                    
                    if (EVENT_ACTIVE && rand < 0.005 && TOTAL_SPECIAL_LIMITED > 0) {
                        cardType = 'special_limited';
                        maxId = TOTAL_SPECIAL_LIMITED; hasRareOrAbove = true;
                    } else if (rand < 0.015) { 
                        cardType = 'super_rare';
                        maxId = TOTAL_SUPER_RARE; hasRareOrAbove = true;
                    } else if (rand < 0.045) { 
                        cardType = 'rare';
                        maxId = TOTAL_RARE; hasRareOrAbove = true;
                    } else {
                        cardType = 'common';
                        maxId = TOTAL_COMMON;
                    }
                    
                    const cardId = Math.floor(Math.random() * maxId + 1).toString().padStart(3, '0');
                    drawnCards.push({type: cardType, id: cardId, isGodPack: false});
                }

                if (!hasRareOrAbove) {
                    if (currentCollectionData.pity_rare_count >= 9) {
                        currentCollectionData.pity_rare_count = 0;
                        let replaceIdx = Math.floor(Math.random() * 10);
                        
                        let pRand = Math.random();
                        let pType = 'rare'; 
                        let pMax = TOTAL_RARE;
                        
                        if (EVENT_ACTIVE && pRand < 0.005 && TOTAL_SPECIAL_LIMITED > 0) {
                            pType = 'special_limited';
                            pMax = TOTAL_SPECIAL_LIMITED;
                        } else if (pRand < 0.015) {
                            pType = 'super_rare';
                            pMax = TOTAL_SUPER_RARE;
                        }
                        
                        let pId = Math.floor(Math.random() * pMax + 1).toString().padStart(3, '0');
                        drawnCards[replaceIdx] = { type: pType, id: pId, isGodPack: false };
                    } else {
                        currentCollectionData.pity_rare_count++;
                    }
                } else {
                    currentCollectionData.pity_rare_count = 0;
                }
            }
        } else if (num === 1) {
            const rand = Math.random();
            let cardType, maxId;
            
            if (EVENT_ACTIVE && rand < 0.005 && TOTAL_SPECIAL_LIMITED > 0) {
                cardType = 'special_limited';
                maxId = TOTAL_SPECIAL_LIMITED;

        const zoneRect = document.getElementById('slash-zone').getBoundingClientRect();

    function executeCut() {
        document.getElementById('slash-zone').classList.add('hidden');
        const packs = document.querySelectorAll('.pack-wrapper');
        
        let hasSpecial = drawnCards.some(c => c.type === 'special_limited');
        let hasSuperRare = drawnCards.some(c => c.type === 'super_rare');
        let hasRare = drawnCards.some(c => c.type === 'rare');
        
        let blastColor = '#ffffff';
        if (isCurrentDrawGodPack) {
            blastColor = 'rainbow';
            document.getElementById('god-pack-bg').classList.remove('hidden');
            document.getElementById('god-pack-glow').classList.remove('hidden');
        }
        else if (hasSpecial) blastColor = '#ff0000';
        else if (hasSuperRare) blastColor = '#ffd700';
        else if (hasRare) blastColor = '#a020f0';
        
        triggerBlast(blastColor);
        
        packs.forEach((p, idx) => {
            const left = p.querySelector('.split-left');
            const right = p.querySelector('.split-right');
            left.style.transform = 'translate(-30%, 50%) rotate(-30deg)';
            right.style.transform = 'translate(30%, 50%) rotate(30deg)';

    function triggerBlast(color) {
        const rainbowColors = ['#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#0000ff', '#4b0082', '#9400d3'];
        for(let i=0; i<80; i++) {
            let pColor = color === 'rainbow' ? rainbowColors[Math.floor(Math.random() * rainbowColors.length)] : color;
            blastParticles.push({
                x: window.innerWidth/2, y: window.innerHeight * 0.4,
                vx: (Math.random()-0.5) * 15, vy: (Math.random()-0.5) * 15,
                s: Math.random() * 5 + 2, life: 1, color: pColor
            });
        }
    }

                updateDiamondUI();
                saveUserData();
                showFloatingText(el, "+" + refundAmt + " 💎");

    // -------------------------------------------------------
    // 核心修正：用 fetch → objectURL 載入圖片，完全繞開
    // canvas CORS taint 問題（直接用 crossOrigin 屬性在
    // CDN 圖片上幾乎必然觸發 SecurityError）
    // -------------------------------------------------------
    async function fetchImageAsBitmap(url) {
        const resp = await fetch(url, { mode: 'cors', cache: 'force-cache' });
        if (!resp.ok) throw new Error(`fetch failed: ${resp.status}`);
        const blob = await resp.blob();
        const objUrl = URL.createObjectURL(blob);
        return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => { URL.revokeObjectURL(objUrl); resolve(img); };
            img.onerror = (e) => { URL.revokeObjectURL(objUrl); reject(e); };
            img.src = objUrl;
        });
    }

    async function buildShareCanvas() {
        const W = 600, H = 840;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');

        const cardImgEl = document.getElementById('fullscreen-card-img');
        const cardSrc   = cardImgEl.src;
        const cardType  = cardImgEl.dataset.type || 'common';

        // 預先用 fetch-blob 方式載入兩張圖，避免 canvas taint
        const [backBitmap, cardBitmap] = await Promise.all([
            fetchImageAsBitmap(IMG_BACK),
            fetchImageAsBitmap(cardSrc)
        ]);

        // 1. 黑色背景漸層
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        const grad = ctx.createRadialGradient(W/2, H/3, 40, W/2, H/3, W * 0.8);
        grad.addColorStop(0, '#1a1a1a');
        grad.addColorStop(1, '#000');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // 2. 飛舞的光點（靜態快照）
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        for (let i = 0; i < 70; i++) {
            ctx.beginPath();
            ctx.arc(Math.random() * W, Math.random() * H, Math.random() * 2.2, 0, Math.PI * 2);
            ctx.fill();
        }

        // 3. 飛舞的 back.png（半透明，隨機位置與角度）
        for (let i = 0; i < 10; i++) {
            const bs = 0.3 + Math.random() * 0.45;
            const bw = 100 * bs, bh = 140 * bs;
            ctx.save();
            ctx.translate(Math.random() * W, Math.random() * H);
            ctx.rotate(Math.random() * Math.PI * 2);
            ctx.globalAlpha = 0.18;
            ctx.drawImage(backBitmap, -bw / 2, -bh / 2, bw, bh);
            ctx.restore();
        }
        ctx.globalAlpha = 1;

        // 4. 主卡牌圖片（置中，佔約 75% 高度）+ 光環
        const cardH = H * 0.75;
        const cardW = cardH * (63 / 88);
        const cx = (W - cardW) / 2;
        const cy = (H - cardH) / 2;

        let glowColor = '#0055ff';
        if (cardType === 'special_limited') glowColor = '#ff0000';
        else if (cardType === 'super_rare')  glowColor = '#ffd700';
        else if (cardType === 'rare')        glowColor = '#a020f0';

        ctx.save();
        ctx.shadowBlur  = 45;
        ctx.shadowColor = glowColor;
        // 繪製多次疊加光暈效果
        for (let g = 0; g < 3; g++) ctx.drawImage(cardBitmap, cx, cy, cardW, cardH);
        ctx.restore();

        // 圓角遮罩（clip 卡牌區域）
        const r = 16;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx + r, cy);
        ctx.lineTo(cx + cardW - r, cy);
        ctx.quadraticCurveTo(cx + cardW, cy, cx + cardW, cy + r);
        ctx.lineTo(cx + cardW, cy + cardH - r);
        ctx.quadraticCurveTo(cx + cardW, cy + cardH, cx + cardW - r, cy + cardH);
        ctx.lineTo(cx + r, cy + cardH);
        ctx.quadraticCurveTo(cx, cy + cardH, cx, cy + cardH - r);
        ctx.lineTo(cx, cy + r);
        ctx.quadraticCurveTo(cx, cy, cx + r, cy);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(cardBitmap, cx, cy, cardW, cardH);
        ctx.restore();

        // 5. 浮水印
        ctx.font = 'bold 22px "Microsoft JhengHei", sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.38)';
        ctx.textAlign = 'center';
        ctx.fillText('Porkémon', W / 2, H - 28);

        return canvas;
    }

    // canvas → Blob（Promise 包裝）
    function canvasToBlob(canvas) {
        return new Promise((resolve, reject) => {
            canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png');
        });
    }

    function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1000);
    }

    function downloadCanvasAsFile(canvas) {
        canvasToBlob(canvas).then(blob => downloadBlob(blob, 'Porkemon_card.png')).catch(console.error);
    }

    async function shareToApp(target) {
        closeSharePanel();
        const hint = document.getElementById('save-hint');
        hint.innerText = "合成圖片中...";
        hint.style.opacity = '1';

        let canvas;
        try {
            canvas = await buildShareCanvas();
        } catch (err) {
            console.error('buildShareCanvas 失敗:', err);
            hint.innerText = "合成失敗，請長按圖片儲存";
            setTimeout(() => hint.style.opacity = '0', 3000);
            return;
        }

        let blob;
        try {
            blob = await canvasToBlob(canvas);
        } catch (err) {
            console.error('canvasToBlob 失敗:', err);
            hint.innerText = "圖片輸出失敗，請稍後再試";
            setTimeout(() => hint.style.opacity = '0', 3000);
            return;
        }

        // ── 複製圖片到剪貼板 ──────────────────────────────
        if (target === 'copy') {
            try {
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                hint.innerText = "✅ 圖片已複製到剪貼板！";
            } catch (e) {
                // 剪貼板 API 不支援時改為下載
                downloadBlob(blob, 'Porkemon_card.png');
                hint.innerText = "已下載圖片（剪貼板不支援）";
            }
            setTimeout(() => hint.style.opacity = '0', 2800);
            return;
        }

        // ── 其他平台：Web Share API（含檔案分享）──────────
        const file = new File([blob], 'Porkemon_card.png', { type: 'image/png' });
        const shareData = { files: [file], title: 'Porkémon 卡片', text: '看我抽到的 Porkémon 卡！🐷✨' };

        if (navigator.canShare && navigator.canShare(shareData)) {
            try {
                await navigator.share(shareData);
                hint.style.opacity = '0';
                return;
            } catch (e) {
                if (e.name === 'AbortError') { hint.style.opacity = '0'; return; }
                // 其他錯誤走 fallback
            }
        }

        // ── Fallback：下載圖片 + 開啟對應 App ──────────────
        downloadBlob(blob, 'Porkemon_card.png');

        const appUrls = {
            whatsapp:  'https://wa.me/',
            instagram: 'https://www.instagram.com/',
            threads:   'https://www.threads.net/',
            x:         'https://twitter.com/intent/tweet?text=' + encodeURIComponent('看我抽到的 Porkémon 卡！🐷✨')
        };
        setTimeout(() => {
            if (appUrls[target]) window.open(appUrls[target], '_blank');
        }, 600);

        hint.innerText = "📥 圖片已下載，請到 App 中貼上分享";
        setTimeout(() => hint.style.opacity = '0', 3500);
    }

    function updateRewardsUI() {
        if(!currentCollectionData.rewards_claimed) {
            currentCollectionData.rewards_claimed = { s1_common: false, s1_rare: false, s1_sr: false, s1_special: false };
        }

        let counts = {
            common: currentCollectionData.common.filter(id => parseInt(id) <= S1_TOTALS.common).length,
            rare: currentCollectionData.rare.filter(id => parseInt(id) <= S1_TOTALS.rare).length,
            sr: currentCollectionData.super_rare.filter(id => parseInt(id) <= S1_TOTALS.super_rare).length,
            special: currentCollectionData.special_limited.filter(id => parseInt(id) <= S1_TOTALS.special_limited).length
        };

        let totalProgressOwned = counts.common + counts.rare + counts.sr;
        let totalProgressBar = S1_TOTALS.common + S1_TOTALS.rare + S1_TOTALS.super_rare;
        let pct = Math.floor((totalProgressOwned / totalProgressBar) * 100);
        
        document.getElementById('s1-progress-text').innerText = `${pct}% (${totalProgressOwned}/${totalProgressBar})`;
        document.getElementById('s1-progress-bar-fill').style.width = `${pct}%`;
        
        if (currentCollectionData.rewards_claimed.s1_special) {
            document.getElementById('special-badge').classList.remove('hidden');
        } else {
            document.getElementById('special-badge').classList.add('hidden');
        }

        setupClaimButton('common', counts.common >= S1_TOTALS.common, currentCollectionData.rewards_claimed.s1_common, "領取 100💎");
        setupClaimButton('rare', counts.rare >= S1_TOTALS.rare, currentCollectionData.rewards_claimed.s1_rare, "領取 200💎");
        setupClaimButton('sr', counts.sr >= S1_TOTALS.super_rare, currentCollectionData.rewards_claimed.s1_sr, "領取 300💎");
        
        let isMasterMet = (pct === 100) && (counts.special >= S1_TOTALS.special_limited);
        setupClaimButton('special', isMasterMet, currentCollectionData.rewards_claimed.s1_special, "領取稱號");
    }

    function setupClaimButton(type, isMet, isClaimed, readyText) {
        let btn = document.getElementById(`btn-claim-${type}`);
        btn.className = 'claim-btn'; 
        
        if (isClaimed) {
            btn.classList.add('claimed');
            btn.innerText = "已領取";
            btn.onclick = null;
        } else if (isMet) {
            btn.classList.add('ready');
            btn.innerText = readyText;
            btn.onclick = () => claimReward(type);
        } else {
            btn.classList.add('unmet');
            btn.innerText = "未達成";
            btn.onclick = null;
        }
    }

    async function claimReward(type) {
        if (!currentCollectionData.rewards_claimed) {
            currentCollectionData.rewards_claimed = { s1_common: false, s1_rare: false, s1_sr: false, s1_special: false };
        }
        
        if (type === 'common') {
            currentCollectionData.diamonds += 100;
            currentCollectionData.rewards_claimed.s1_common = true;
            alert("🎉 恭喜儲齊 S1 普通卡！獲得 100 💎");
        } else if (type === 'rare') {
            currentCollectionData.diamonds += 200;
            currentCollectionData.rewards_claimed.s1_rare = true;
            alert("🎉 恭喜儲齊 S1 稀有卡！獲得 200 💎");
        } else if (type === 'sr') {
            currentCollectionData.diamonds += 300;
            currentCollectionData.rewards_claimed.s1_sr = true;
            alert("🎉 恭喜儲齊 S1 超級稀有卡！獲得 300 💎");
        } else if (type === 'special') {
            hasSpecialGlobal = true;
            currentCollectionData.rewards_claimed.s1_special = true;
            alert("🏆 恭喜完全集齊！解鎖「肥豬大師勳章」及「金色玩家名稱」！");
        }
        
        if (currentCollectionData.diamonds > 99999) currentCollectionData.diamonds = 99999;
        updateDiamondUI();
        updateRewardsUI();
        await saveUserData();
    }

    function updateCollectionUI() {
        const tabNav = document.getElementById('collection-tabs');
        const content = document.getElementById('collection-content');
        let data = currentCollectionData || { common: [], rare: [], super_rare: [], special_limited: [], diamonds: 0, pity_rare_count: 0 };
        
        updateRewardsUI();

        tabNav.innerHTML = "";
        content.innerHTML = "";

        const tabs = [
            { id: 'common', total: TOTAL_COMMON, list: data.common, label: '普通' },
            { id: 'rare', total: TOTAL_RARE, list: data.rare, label: '稀有' },
            { id: 'super_rare', total: TOTAL_SUPER_RARE, list: data.super_rare, label: '超級稀有' },
            { id: 'special_limited', total: TOTAL_SPECIAL_LIMITED, list: data.special_limited, label: '特別限定' }
        ];

        let firstAvailableTab = null;

        tabs.forEach(tab => {
            if (tab.total > 0) {
                if (!firstAvailableTab) firstAvailableTab = tab.id;

                const btn = document.createElement('div');
                btn.className = 'tab-btn';
                btn.id = `btn-${tab.id}`;
                btn.innerText = tab.label;
                btn.onclick = () => switchTab(tab.id);
                tabNav.appendChild(btn);

                const section = document.createElement('div');
                section.className = 'tab-section';
                section.id = `sec-${tab.id}`;
                section.innerHTML = buildGridHTML(tab.id, tab.total, tab.list);
                content.appendChild(section);
            }
        });

        if (firstAvailableTab) {
            switchTab(firstAvailableTab);
        }
    }
</script>
</body>
</html>
