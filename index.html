<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抽肥豬卡 - Porkémon</title>
    <style>
        :root {
            --gold-glow: 0 0 20px #ffd700, 0 0 40px #ffaa00, 0 0 80px #ff8800;
            --white-glow: 0 0 20px #ffffff, 0 0 40px #cccccc, 0 0 80px #aaaaaa;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: white;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden; touch-action: none;
        }

        /* 背景與 UI 層次 */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
        #ui-layer { position: relative; z-index: 10; width: 100%; height: 100%; display: flex; flex-direction: column; pointer-events: none; }

        .screen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .hidden { display: none !important; }

        /* 身份選擇 */
        .select-wrapper { position: relative; margin-bottom: 50px; pointer-events: auto; }
        #user-select {
            appearance: none; -webkit-appearance: none; background: transparent; border: none; color: white;
            font-size: 48px; font-weight: bold; padding-right: 40px; cursor: pointer; outline: none; text-align: center;
        }
        .custom-arrow { position: absolute; right: 0; top: 60%; transform: translateY(-50%); font-size: 24px; color: #888; pointer-events: none; }
        #btn-enter { background: transparent; border: 1.5px solid #fff; color: #fff; padding: 10px 40px; font-size: 18px; cursor: pointer; pointer-events: auto; }

        /* 抽卡舞台 */
        #stage { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }

        /* 切開動畫與包裝容器 */
        .pack-wrapper {
            position: absolute; bottom: -100%; width: 70vh; max-width: 400px; height: 100vh; max-height: 600px;
            transition: bottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none;
        }
        .pack-wrapper.active { bottom: 10%; pointer-events: auto; }
        
        .pack-half {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            transition: transform 0.8s ease-in, opacity 0.8s ease-in;
        }
        .split-left { clip-path: polygon(0 0, 100% 0, 0 100%); } /* 左半斜切 */
        .split-right { clip-path: polygon(100% 0, 100% 100%, 0 100%); } /* 右半斜切 */

        /* 偵測區域 (上方 1/3) */
        #slash-zone {
            position: absolute; top: 0; left: 15%; width: 70%; height: 35%;
            z-index: 200; pointer-events: auto;
        }

        /* 3D 翻轉卡片容器 */
        .card-container {
            position: absolute; width: 50vh; max-width: 280px; aspect-ratio: 63/88; /* 寶可夢卡比例 */
            perspective: 1000px; display: none; z-index: 100; opacity: 0;
            transition: opacity 1s ease-out, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(100px) scale(0.8); /* 初始在較低位置 */
            pointer-events: auto; cursor: pointer;
        }
        .card-container.reveal { opacity: 1; transform: translateY(0) scale(1); }
        
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.8s; transform-style: preserve-3d;
        }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 12px;
            background-size: cover; background-position: center;
        }
        .card-back { transform: rotateY(0deg); border: 2px solid #333; }
        .card-front { transform: rotateY(180deg); }
        .is-flipped { transform: rotateY(180deg); }

        /* 底部導航 */
        .bottom-nav { position: absolute; bottom: 40px; display: flex; gap: 20px; pointer-events: auto; z-index: 250;}
        .draw-btn { background: #fff; color: #000; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 50px; cursor: pointer; }

        /* 收藏頁面 */
        #collection-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 20px; width: 90%; overflow-y: auto; pointer-events: auto; }
        .card-slot { width: 100%; aspect-ratio: 63/88; background: #222; border-radius: 5px; overflow: hidden; }
        .card-slot img { width: 100%; height: 100%; object-fit: cover; opacity: 0.2; }
        .card-slot.owned img { opacity: 1; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="particle-canvas"></canvas> <div id="ui-layer">
    <section id="login-screen" class="screen">
        <div class="select-wrapper">
            <select id="user-select">
                <option value="Suki">Suki</option>
                <option value="Nelson">Nelson</option>
                <option value="爸爸">爸爸</option>
                <option value="媽媽">媽媽</option>
                <option value="細佬">細佬</option>
                <option value="Rainbow">Rainbow</option>
            </select>
            <div class="custom-arrow">▼</div>
        </div>
        <button id="btn-enter">進入卡池</button>
    </section>

    <section id="main-screen" class="screen hidden">
        <div id="stage">
            <div id="slash-zone" class="hidden"></div>
            </div>
        <div class="bottom-nav">
            <button class="draw-btn" onclick="prepareDraw(1)">單抽</button>
            <button class="draw-btn" onclick="prepareDraw(10)">十連抽</button>
            <button class="draw-btn" style="background:none; color:white; border:1px solid white;" onclick="showScreen('collection-screen')">收藏</button>
        </div>
    </section>

    <section id="collection-screen" class="screen hidden">
        <div style="padding: 20px; pointer-events: auto; text-align: center; width: 100%;">
            <button class="draw-btn" onclick="showScreen('main-screen')" style="margin-bottom:10px;">返回</button>
            <h2 id="user-title"></h2>
        </div>
        <div id="collection-grid"></div>
    </section>
</div>

<script>
    // --- 資源路徑設定 (使用 Raw 連結，確保 PNG 大寫) ---
    const BASE_URL = "https://raw.githubusercontent.com/8ytxybb7cg-web/Porkemon/main/";
    const IMG_PACK = BASE_URL + "packs/pack.png";
    const IMG_BACK = BASE_URL + "back/back.png";
    
    let currentUser = "";
    let drawnCards = [];
    let isSlashing = false;
    let gameState = "login"; // 'login' | 'drawing'

    // --- 背景與特效 Canvas 系統 ---
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    
    let flyingBacks = [];
    let baseParticles = [];
    let blastParticles = [];
    let slashPath = [];

    const backImgObj = new Image();
    backImgObj.src = IMG_BACK;

    function resizeCanvas() {
        bgCanvas.width = pCanvas.width = window.innerWidth;
        bgCanvas.height = pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 初始化背景元素
    for(let i=0; i<60; i++) {
        baseParticles.push({ x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height, s: Math.random()*2, v: 0.5+Math.random()*1 });
    }
    for(let i=0; i<12; i++) {
        flyingBacks.push({
            x: Math.random()*bgCanvas.width, y: Math.random()*bgCanvas.height,
            r: Math.random()*Math.PI*2, s: 0.3 + Math.random()*0.4,
            vx: (Math.random()-0.5)*1.5, vy: (Math.random()-0.5)*1.5, vr: (Math.random()-0.5)*0.03
        });
    }

    function renderLoop() {
        // 1. 繪製底層背景 (Spotlight)
        bgCtx.fillStyle = '#000';
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
        const grad = bgCtx.createRadialGradient(bgCanvas.width/2, bgCanvas.height/3, 50, bgCanvas.width/2, bgCanvas.height/3, bgCanvas.width*0.8);
        grad.addColorStop(0, '#1a1a1a'); grad.addColorStop(1, '#000');
        bgCtx.fillStyle = grad;
        bgCtx.fillRect(0,0, bgCanvas.width, bgCanvas.height);

        // 2. 繪製基本光點粒子
        bgCtx.fillStyle = 'rgba(255,255,255,0.4)';
        baseParticles.forEach(p => {
            p.y -= p.v;
            if(p.y < 0) p.y = bgCanvas.height;
            bgCtx.beginPath(); bgCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); bgCtx.fill();
        });

        // 3. 繪製飛舞卡背 (僅在抽卡階段)
        if(gameState === 'drawing') {
            flyingBacks.forEach(c => {
                c.x += c.vx; c.y += c.vy; c.r += c.vr;
                if(c.x < -100) c.x = bgCanvas.width+100; if(c.x > bgCanvas.width+100) c.x = -100;
                if(c.y < -100) c.y = bgCanvas.height+100; if(c.y > bgCanvas.height+100) c.y = -100;
                bgCtx.save();
                bgCtx.translate(c.x, c.y); bgCtx.rotate(c.r); bgCtx.globalAlpha = 0.2;
                if(backImgObj.complete) bgCtx.drawImage(backImgObj, -50*c.s, -70*c.s, 100*c.s, 140*c.s);
                bgCtx.restore();
            });
        }

        // 4. 特效層 (清空並重繪)
        pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
        
        // 繪製劃動軌跡
        if(isSlashing && slashPath.length > 1) {
            pCtx.shadowBlur = 20; pCtx.shadowColor = "#fff"; pCtx.strokeStyle = "#fff";
            pCtx.lineWidth = 6; pCtx.lineCap = "round";
            pCtx.beginPath(); pCtx.moveTo(slashPath[0].x, slashPath[0].y);
            slashPath.forEach(p => pCtx.lineTo(p.x, p.y)); pCtx.stroke();
            pCtx.shadowBlur = 0;
        }

        // 繪製爆炸光芒粒子
        for(let i=blastParticles.length-1; i>=0; i--) {
            let p = blastParticles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 0.02;
            if(p.life <= 0) { blastParticles.splice(i, 1); continue; }
            pCtx.fillStyle = p.color;
            pCtx.globalAlpha = p.life;
            pCtx.beginPath(); pCtx.arc(p.x, p.y, p.s, 0, Math.PI*2); pCtx.fill();
        }
        pCtx.globalAlpha = 1;

        requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);


    // --- UI 與流程控制 ---
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'collection-screen') updateCollectionUI();
    }

    document.getElementById('btn-enter').onclick = () => {
        currentUser = document.getElementById('user-select').value;
        document.getElementById('user-title').innerText = currentUser + " 的收藏";
        gameState = 'drawing'; // 切換背景狀態
        showScreen('main-screen');
    };

    function prepareDraw(num) {
        const stage = document.getElementById('stage');
        // 清理舞台，保留 slash-zone
        Array.from(stage.children).forEach(child => {
            if(child.id !== 'slash-zone') child.remove();
        });
        
        drawnCards = [];
        const zone = document.getElementById('slash-zone');
        zone.classList.add('hidden');

        // 生成卡包 (為十連抽準備重疊)
        for(let i=0; i<num; i++) {
            const wrap = document.createElement('div');
            wrap.className = 'pack-wrapper';
            wrap.id = `pack-${i}`;
            wrap.style.zIndex = 50 - i;
            // 稍微偏移製造重疊感
            let offsetX = num > 1 ? (Math.random()-0.5)*20 : 0;
            let offsetY = num > 1 ? (Math.random()-0.5)*20 : 0;
            wrap.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${(Math.random()-0.5)*4}deg)`;
            
            // 準備兩半供物理切開
            wrap.innerHTML = `
                <div class="pack-half split-left" style="background-image:url(${IMG_PACK})"></div>
                <div class="pack-half split-right" style="background-image:url(${IMG_PACK})"></div>
            `;
            stage.appendChild(wrap);
            
            // 決定卡片
            const isRare = Math.random() < 0.03;
            const maxId = isRare ? 9 : 14;
            const cardId = Math.floor(Math.random() * maxId + 1).toString().padStart(3, '0');
            drawnCards.push({type: isRare ? 'rare' : 'common', id: cardId});
        }

        setTimeout(() => {
            document.querySelectorAll('.pack-wrapper').forEach(p => p.classList.add('active'));
            zone.classList.remove('hidden');
        }, 50);
    }

    // --- 水果忍者切開偵測 ---
    const uiLayer = document.getElementById('ui-layer');
    uiLayer.addEventListener('touchstart', (e) => {
        if(document.getElementById('slash-zone').classList.contains('hidden')) return;
        isSlashing = true; slashPath = [{x: e.touches[0].clientX, y: e.touches[0].clientY}];
    });

    uiLayer.addEventListener('touchmove', (e) => {
        if(!isSlashing) return;
        const x = e.touches[0].clientX; const y = e.touches[0].clientY;
        slashPath.push({x, y});
        
        const zoneRect = document.getElementById('slash-zone').getBoundingClientRect();
        if(x > zoneRect.left && x < zoneRect.right && y > zoneRect.top && y < zoneRect.bottom) {
            executeCut();
            isSlashing = false; // 觸發後停止劃線
        }
    });

    uiLayer.addEventListener('touchend', () => { isSlashing = false; slashPath = []; });

    // --- 物理切開與粒子爆發 ---
    function executeCut() {
        document.getElementById('slash-zone').classList.add('hidden');
        const packs = document.querySelectorAll('.pack-wrapper');
        let hasRare = drawnCards.some(c => c.type === 'rare');

        // 生成噴發粒子 (根據最高稀有度)
        triggerBlast(hasRare ? '#ffd700' : '#ffffff');

        packs.forEach((p, idx) => {
            const left = p.querySelector('.split-left');
            const right = p.querySelector('.split-right');
            // 兩半傾斜掉落
            left.style.transform = 'translate(-30%, 50%) rotate(-30deg)';
            right.style.transform = 'translate(30%, 50%) rotate(30deg)';
            left.style.opacity = '0'; right.style.opacity = '0';

            // 隨後生成卡片並升起
            setTimeout(() => { showResultCard(idx); }, 500);
        });
    }

    function triggerBlast(color) {
        for(let i=0; i<80; i++) {
            blastParticles.push({
                x: window.innerWidth/2, y: window.innerHeight * 0.4, // 約切口位置
                vx: (Math.random()-0.5) * 15, vy: (Math.random()-0.5) * 15,
                s: Math.random() * 5 + 2, life: 1, color: color
            });
        }
    }

    // --- 卡片升起與翻牌 ---
    function showResultCard(idx) {
        const result = drawnCards[idx];
        const stage = document.getElementById('stage');
        const container = document.createElement('div');
        container.className = 'card-container';
        
        // 排版處理 (十連抽 vs 單抽)
        if(drawnCards.length > 1) {
            container.style.width = '25vw'; container.style.maxWidth = '150px';
            const row = Math.floor(idx / 5); const col = idx % 5;
            // 簡單網格計算
            container.style.left = `${10 + col * 16}%`;
            container.style.top = `${20 + row * 30}%`;
        }

        const glow = result.type === 'rare' ? 'var(--gold-glow)' : 'var(--white-glow)';
        const frontImgSrc = `${BASE_URL}cards_${result.type}/${result.id}.PNG`;

        container.innerHTML = `
            <div class="card-inner" onclick="flipCard(this, '${result.type}', '${result.id}')">
                <div class="card-back" style="background-image:url('${IMG_BACK}'); box-shadow:${glow}"></div>
                <div class="card-front" style="background-image:url('${frontImgSrc}')"></div>
            </div>
        `;
        stage.appendChild(container);
        
        container.style.display = 'block';
        // 觸發升起動畫
        setTimeout(() => { container.classList.add('reveal'); }, 50 * idx);
    }

    function flipCard(el, type, id) {
        if(el.classList.contains('is-flipped')) return;
        el.classList.add('is-flipped');
        
        // 記錄到 LocalStorage
        let data = JSON.parse(localStorage.getItem('porkemon_' + currentUser) || '{"common":[], "rare":[]}');
        if(!data[type].includes(id)) data[type].push(id);
        localStorage.setItem('porkemon_' + currentUser, JSON.stringify(data));
    }

    // --- 收藏圖鑑 ---
    function updateCollectionUI() {
        const grid = document.getElementById('collection-grid');
        let data = JSON.parse(localStorage.getItem('porkemon_' + currentUser) || '{"common":[], "rare":[]}');
        grid.innerHTML = "";
        
        // 顯示 Common (14張)
        for(let i=1; i<=14; i++) {
            const id = i.toString().padStart(3, '0');
            const slot = document.createElement('div');
            slot.className = `card-slot ${data.common.includes(id) ? 'owned' : ''}`;
            slot.innerHTML = `<img src="${BASE_URL}cards_common/${id}.PNG" alt="Common ${id}">`;
            grid.appendChild(slot);
        }
        // 顯示 Rare (9張)
        for(let i=1; i<=9; i++) {
            const id = i.toString().padStart(3, '0');
            const slot = document.createElement('div');
            slot.className = `card-slot ${data.rare.includes(id) ? 'owned' : ''}`;
            slot.innerHTML = `<img src="${BASE_URL}cards_rare/${id}.PNG" alt="Rare ${id}">`;
            grid.appendChild(slot);
        }
    }
</script>
</body>
</html>
